[package]
name = "re-roll"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false
# No version here: tauri.conf.json takes package.json's, so it is set in one place.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
dunce = "1"

# glib 0.18 comes from Tauri's Linux GTK stack, which pins it. This copy carries the fix glib 0.20 made for
# GHSA-wrw7-89jp-8q8g (an unsound out-pointer in VariantStrIter). Drop it when Tauri moves to glib 0.20 or later.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
