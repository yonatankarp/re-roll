[package]
name = "re-roll"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false
# No version here: tauri.conf.json takes package.json's, so it is set in one place.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
dunce = "1"

# glib 0.18.5 with the RUSTSEC-2024-0429 fix backported (Linux only); see patches/README.md.
[patch.crates-io]
glib = { path = "patches/glib-0.18.5" }
