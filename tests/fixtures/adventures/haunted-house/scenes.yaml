- id: hallway
  text: The hallway smells of cold ash and old roses.
  art: assets/hallway.txt
  choices:
    - label: Try the cellar door
      effects:
        - { kind: advanceClock, clock: rising-dread }
        - { kind: goto, scene: cellar-door }
    - label: Talk to the caretaker
      when: { kind: attitude, npc: caretaker, atLeast: -1 }
      effects:
        - { kind: adjustAttitude, npc: caretaker, by: 1 }
        - { kind: reveal, secret: buried-letter }
        - { kind: goto, scene: cellar-door }
- id: cellar-door
  text: The door is warm to the touch, and something knocks back.
  choices:
    - label: Force the lock
      check: { risk: high }
      results:
        hit:
          - { kind: goto, scene: escape }
        mixed:
          - { kind: advanceClock, clock: rising-dread }
          - { kind: goto, scene: escape }
        miss:
          - { kind: goto, scene: doors-seal }
- id: footsteps-above
  text: Slow footsteps cross the floor above, though the house has no upstairs.
  choices:
    - label: Keep moving
      effects:
        - { kind: goto, scene: cellar-door }
- id: doors-seal
  text: Every door in the house clicks shut at once.
- id: escape
  text: Cold air and starlight hit you as you stumble out onto Mere Lane.
