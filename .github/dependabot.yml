# Weekly update PRs for npm, the Tauri app's crates and the CI actions. Security updates come as they're published.
# On each Tauri bump, recheck the vendored glib patch (app/desktop/src-tauri/patches/README.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Must match the copy kokoro-js bundles, or the hub settings we apply never reach the model.
      - dependency-name: "@huggingface/transformers"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /app/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
