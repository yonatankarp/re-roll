name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: the soak suite and the balance check
    - cron: "0 4 * * 1" # weekly: the desktop bundles
  workflow_dispatch:
    inputs:
      nightly:
        description: Also run the nightly soak suite and balance check
        type: boolean
        default: false
      bundle:
        description: Also build the desktop bundles on the three OSes
        type: boolean
        default: false

permissions:
  contents: read

# A newer run on a branch cancels the older one. Each run on main gets its own group, so none is cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The local pre-commit hook is opt-in, so a clone without it could commit book content.
      - name: No book content is tracked
        shell: bash
        run: |
          if git ls-files | grep -iE '(^|/)(books|private)(/|$)'; then
            echo "::error::The paths above are book content; they belong only in the private books/ repository."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Type-aware lint of the whole repo needs a little more than the default heap on macOS runners.
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run format:check
      - run: npm run check-pack
      - run: npm run check-pack:fixtures
      - run: npm run check-bundle
      - run: npm test

  # Coverage reports and thresholds. continue-on-error keeps a failure here from failing the run.
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  tauri:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-webview
      # Rust and clippy come with the runner image.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/desktop/src-tauri
      - run: npm ci
      # The Tauri context reads the built frontend at compile time.
      - run: npm run ui:build
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app/desktop/src-tauri
      - run: cargo test --locked
        working-directory: app/desktop/src-tauri

  # The Playwright tests of the built game under the desktop app's CSP, in Chromium (WebView2's engine)
  # and WebKit (macOS and Linux webviews), side by side.
  ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # With the browser cached this only installs its system libraries.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:ui -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Nightly: the soak suite and the balance check, outside the unit run.
  nightly:
    if: github.event.schedule == '0 3 * * *' || inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:soak
      - run: npm run bot:check

  # Weekly: a debug build of the installers, so bundling is exercised somewhere.
  bundle:
    if: github.event.schedule == '0 4 * * 1' || inputs.bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-webview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/desktop/src-tauri
      - run: npm ci
      # Runs ui:build and check-bundle first, as tauri.conf.json's beforeBuildCommand.
      - run: npx tauri build --debug
