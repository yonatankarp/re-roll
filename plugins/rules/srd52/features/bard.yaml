- id: srd52:feature/bardic-inspiration
  name: Bardic Inspiration
  text: |-
    You can supernaturally inspire others through words, music, or dance. This inspiration is represented by your Bardic Inspiration die, which is a d6. Using Bardic Inspiration. As a Bonus Action, you can inspire another creature within 60 feet of yourself who can see or hear you. That creature gains Cantrips

    ——Spell Slots per Spell Level—— 1 2 3 4 5 6 7 8 9

    — one of your Bardic Inspiration dice. A creature can have only one Bardic Inspiration die at a time. Once within the next hour when the creature fails a D20 Test, the creature can roll the Bardic Inspiration die and add the number rolled to the d20, potentially turning the failure into a success. A Bardic Inspiration die is expended when it’s rolled. Number of Uses. You can confer a Bardic Inspiration die a number of times equal to your Charisma modifier (minimum of once), and you regain all expended uses when you finish a Long Rest. At Higher Levels. Your Bardic Inspiration die changes when you reach certain Bard levels, as shown in the Bardic Die column of the Bard Features table. The die becomes a d8 at level 5, a d10 at level 10, and a d12 at level 15.
  automation: full
  resources:
    - id: bardic-inspiration
      max:
        base: 0
        add:
          - kind: abilityMod
            ability: cha
        min: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: bardic-inspiration
      targeting:
        creatures: 1
        range: 60
        side: ally
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: inspired
              amount:
                dice: 1d6
                dieSize: bardicDie
            duration:
              minutes: 60
- id: srd52:feature/jack-of-all-trades
  name: Jack of All Trades
  text: You can add half your Proficiency Bonus (round down) to any ability check you make that uses a skill proficiency you lack and that doesn’t otherwise use your Proficiency Bonus. For example, if you make a Strength (Athletics) check and lack Athletics proficiency, you can add half your Proficiency Bonus to the check.
  automation: full
  passives:
    - kind: halfProficiency
- id: srd52:feature/bard-subclass
  name: Bard Subclass
  text: You gain a Bard subclass of your choice. The College of Lore subclass is detailed after this class’s description. A subclass is a specialization that grants you features at certain Bard levels. For the rest of your career, you gain each of your subclass’s features that are of your Bard level or lower.
  automation: full
- id: srd52:feature/font-of-inspiration
  name: Font of Inspiration
  text: You now regain all your expended uses of Bardic Inspiration when you finish a Short or Long Rest. In addition, you can expend a spell slot (no action required) to regain one expended use of Bardic Inspiration.
  automation: full
  resources:
    - id: bardic-inspiration
      max:
        base: 0
        add:
          - kind: abilityMod
            ability: cha
        min: 1
      recharge:
        - on: shortRest
          amount: all
  activations:
    - cost:
        - slot
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: regain
            resource: bardic-inspiration
- id: srd52:feature/countercharm
  name: Countercharm
  text: You can use musical notes or words of power to disrupt mind-influencing effects. If you or a creature within 30 feet of you fails a saving throw against an effect that applies the Charmed or Frightened condition, you can take a Reaction to cause the save to be rerolled, and the new roll has Advantage.
  automation: full
  activations:
    - cost:
        - reaction
      trigger:
        rolled:
          rolls:
            - save
          by: selfOrAlly
          when: failed
          conditions:
            - charmed
            - frightened
        within: 30
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: reroll
            advantage: true
- id: srd52:feature/magical-secrets
  name: Magical Secrets
  text: You’ve learned secrets from various magical traditions. Whenever you reach a Bard level (including this level) and the Prepared Spells number in the Bard Features table increases, you can choose any of your new prepared spells from the Bard, Cleric, Druid, and Wizard spell lists, and the chosen spells count as Bard spells for you (see a class’s section for its spell list). In addition, whenever you replace a spell prepared for this class, you can replace it with a spell from those lists.
  automation: full
  widens:
    lists:
      - srd52:class/cleric
      - srd52:class/druid
      - srd52:class/wizard
- id: srd52:feature/superior-inspiration
  name: Superior Inspiration
  text: When you roll Initiative, you regain expended uses of Bardic Inspiration until you have two if you have fewer than that.
  automation: full
  resources:
    - id: bardic-inspiration
      max:
        base: 0
        add:
          - kind: abilityMod
            ability: cha
        min: 1
      recharge:
        - on: initiative
          amount: all
          upTo: 2
- id: srd52:feature/words-of-creation
  name: Words of Creation
  text: "You have mastered two of the Words of Creation: the words of life and death. You therefore always have the Power Word Heal and Power Word Kill spells prepared. When you cast either spell, you can target a second creature with it if that creature is within 10 feet of the first target."
  automation: full
  spells:
    "20":
      - srd52:spell/power-word-heal
      - srd52:spell/power-word-kill
  passives:
    - kind: extraTarget
      spells:
        - srd52:spell/power-word-heal
        - srd52:spell/power-word-kill
- id: srd52:feature/bonus-proficiencies
  name: Bonus Proficiencies
  text: You gain proficiency with three skills of your choice.
  automation: full
- id: srd52:feature/cutting-words
  name: Cutting Words
  text: You learn to use your wit to supernaturally distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of yourself makes a damage roll or succeeds on an ability check or attack roll, you can take a Reaction to expend one use of your Bardic Inspiration; roll your Bardic Inspiration die, and subtract the number rolled from the creature’s roll, reducing the damage or potentially turning the success into a failure.
  automation: full
  activations:
    - cost:
        - reaction
        - resource: bardic-inspiration
      label: Cutting Words
      trigger:
        rolled:
          rolls:
            - attack
            - check
          by: foe
        within: 60
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: rollBonus
            either: true
            amount:
              dice: 1d6
              dieSize: bardicDie
    - cost:
        - reaction
        - resource: bardic-inspiration
      label: Cutting Words against damage
      trigger:
        damaged: true
        before: true
        within: 60
      targeting:
        creatures: 1
        range: 60
        side: ally
      resolution:
        kind: automatic
        effects:
          - kind: reduceDamage
            amount:
              dice: 1d6
              dieSize: bardicDie
- id: srd52:feature/magical-discoveries
  name: Magical Discoveries
  text: You learn two spells of your choice. These spells can come from the Cleric, Druid, or Wizard spell list or any combination thereof (see a class’s section for its spell list). A spell you choose must be a cantrip or a spell for which you have spell slots, as shown in the Bard Features table. You always have the chosen spells prepared, and whenever you gain a Bard level, you can replace one of the spells with another spell that meets these requirements.
  automation: full
- id: srd52:feature/peerless-skill
  name: Peerless Skill
  text: When you make an ability check or attack roll and fail, you can expend one use of Bardic Inspiration; roll the Bardic Inspiration die, and add the number rolled to the d20, potentially turning a failure into a success. On a failure, the Bardic Inspiration isn’t expended.
  automation: full
  passives:
    - kind: checkRescue
      bonusDice: 1d6
      dieSize: bardicDie
      resource: bardic-inspiration
      keep: true
    - kind: missBoost
      resource: bardic-inspiration
      dieSize: bardicDie
