- id: srd52:feature/eldritch-invocations
  name: Eldritch Invocations
  text: |-
    You have unearthed Eldritch Invocations, pieces of forbidden knowledge that imbue you with an abiding magical ability or other lessons. You gain one invocation of your choice, such as Pact of the Tome. Invocations are described in the “Eldritch Invocation Options” section later in this class’s description. Prerequisites. If an invocation has a prerequisite, you must meet it to learn that invocation. For example, if an invocation requires you to be a level 5+ Warlock, you can select the invocation once you reach Warlock level 5. Replacing and Gaining Invocations. Whenever you gain a Warlock level, you can replace one of your invocations with another one for which you

    Warlock Features Proficiency Level Bonus Class Features

    Eldritch Invocations, Pact Magic

    Mystic Arcanum (level 6 spell)

    Mystic Arcanum (level 7 spell)

    Mystic Arcanum (level 8 spell)

    Mystic Arcanum (level 9 spell)

    qualify. You can’t replace an invocation if it’s a prerequisite for another invocation that you have. When you gain certain Warlock levels, you gain more invocations of your choice, as shown in the Invocations column of the Warlock Features table. You can’t pick the same invocation more than once unless its description says otherwise.
  automation: full
- id: srd52:feature/pact-magic
  name: Pact Magic
  text: |-
    Through occult ceremony, you have formed a pact with a mysterious entity to gain magical powers. The entity is a voice in the shadows—its identity unclear—but its boon to you is concrete: the ability to cast spells. See “Spells” for the rules on spellcasting. The information below details how you use those rules with Warlock spells, which appear in the Warlock spell list later in the class’s description. Cantrips. You know two Warlock cantrips of your choice. Eldritch Blast and Prestidigitation are recommended. Whenever you gain a Warlock level, you can replace one of your cantrips from this feature with another Warlock cantrip of your choice. When you reach Warlock levels 4 and 10, you learn another Warlock cantrip of your choice, as shown in the Cantrips column of the Warlock Features table.

    Spell Slots. The Warlock Features table shows how many spell slots you have to cast your Warlock spells of levels 1–5. The table also shows the level of those slots, all of which are the same level. You regain all expended Pact Magic spell slots when you finish a Short or Long Rest. For example, when you’re a level 5 Warlock, you have two level 3 spell slots. To cast the level 1 spell Charm Person, you must spend one of those slots, and you cast it as a level 3 spell. Prepared Spells of Level 1+. You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Warlock spells. Charm Person and Hex are recommended. The number of spells on your list increases as you gain Warlock levels, as shown in the Prepared Spells column of the Warlock Features table. Whenever that number increases, choose additional Warlock spells until the number of spells on your list matches the number in the table. The chosen spells must be of a level no higher than what’s shown in the table’s Slot Level column for your level. When you reach level 6, for example, you learn a new Warlock spell, which can be of levels 1–3. If another Warlock feature gives you spells that you always have prepared, those spells don’t count

    against the number of spells you can prepare with this feature, but those spells otherwise count as Warlock spells for you. Changing Your Prepared Spells. Whenever you gain a Warlock level, you can replace one spell on your list with another Warlock spell of an eligible level. Spellcasting Ability. Charisma is the spellcasting ability for your Warlock spells. Spellcasting Focus. You can use an Arcane Focus as a Spellcasting Focus for your Warlock spells.
  automation: full
- id: srd52:feature/magical-cunning
  name: Magical Cunning
  text: You can perform an esoteric rite for 1 minute. At the end of it, you regain expended Pact Magic spell slots but no more than a number equal to half your maximum (round up). Once you use this feature, you can’t do so again until you finish a Long Rest.
  automation: full
  resources:
    - id: magical-cunning
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - resource: magical-cunning
      outOfCombat: true
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: regain
            resource: slots
            count: half
- id: srd52:feature/warlock-subclass
  name: Warlock Subclass
  text: You gain a Warlock subclass of your choice. The Fiend Patron subclass is detailed after this class’s description. A subclass is a specialization that grants you features at certain Warlock levels. For the rest of your career, you gain each of your subclass’s features that are of your Warlock level or lower.
  automation: full
- id: srd52:feature/contact-patron
  name: Contact Patron
  text: In the past, you usually contacted your patron through intermediaries. Now you can communicate directly; you always have the Contact Other Plane spell prepared. With this feature, you can cast the spell without expending a spell slot to contact your patron, and you automatically succeed on the spell’s saving throw. Once you cast the spell with this feature, you can’t do so in this way again until you finish a Long Rest.
  automation: full
  spells:
    "1":
      - srd52:spell/contact-other-plane
  freeCast: true
- id: srd52:feature/mystic-arcanum
  name: Mystic Arcanum
  text: |-
    Your patron grants you a magical secret called an arcanum. Choose one level 6 Warlock spell as this arcanum. You can cast your arcanum spell once without expending a spell slot, and you must finish a Long Rest before you can cast it in this way again. As shown in the Warlock Features table, you gain another Warlock spell of your choice that can be cast in this way when you reach Warlock levels 13 (level 7 spell), 15 (level 8 spell), and 17 (level 9 spell). You regain all uses of your Mystic Arcanum when you finish a Long Rest.

    Whenever you gain a Warlock level, you can replace one of your arcanum spells with another Warlock spell of the same level.
  automation: full
- id: srd52:feature/eldritch-master
  name: Eldritch Master
  text: When you use your Magical Cunning feature, you regain all your expended Pact Magic spell slots.
  automation: full
  activations:
    - cost:
        - resource: magical-cunning
      outOfCombat: true
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: regain
            resource: slots
            count: all
- id: srd52:feature/dark-one-s-blessing
  name: Dark One’s Blessing
  text: When you reduce an enemy to 0 Hit Points, you gain Temporary Hit Points equal to your Charisma modifier plus your Warlock level (minimum of 1 Temporary Hit Point). You also gain this benefit if someone else reduces an enemy within 10 feet of you to 0 Hit Points.
  automation: full
  passives:
    - kind: onKill
      within: 10
      mine: true
      effects:
        - kind: tempHp
          amount:
            bonus:
              add:
                - kind: abilityMod
                  ability: cha
                - kind: classLevel
                  class: srd52:class/warlock
              min: 1
- id: srd52:feature/fiend-spells
  name: Fiend Spells
  text: |-
    The magic of your patron ensures you always have certain spells ready; when you reach a Warlock level specified in the Fiend Spells table, you thereafter always have the listed spells prepared.

    Fiend Spells Warlock Level Spells

    Burning Hands, Command, Scorching Ray, Suggestion
  automation: full
  spells:
    "3":
      - srd52:spell/burning-hands
      - srd52:spell/command
      - srd52:spell/scorching-ray
      - srd52:spell/suggestion
    "5":
      - srd52:spell/fireball
      - srd52:spell/stinking-cloud
    "7":
      - srd52:spell/fire-shield
      - srd52:spell/wall-of-fire
    "9":
      - srd52:spell/geas
      - srd52:spell/insect-plague
- id: srd52:feature/dark-one-s-own-luck
  name: Dark One’s Own Luck
  text: You can call on your fiendish patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add 1d10 to your roll. You can do so after seeing the roll but before any of the roll’s effects occur. You can use this feature a number of times equal to your Charisma modifier (minimum of once), but you can use it no more than once per roll. You regain all expended uses when you finish a Long Rest.
  automation: full
  resources:
    - id: dark-ones-own-luck
      max:
        base: 0
        add:
          - kind: abilityMod
            ability: cha
        min: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - resource: dark-ones-own-luck
      trigger:
        rolled:
          rolls:
            - check
            - save
          by: self
          when: failed
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: rollBonus
            amount:
              dice: 1d10
