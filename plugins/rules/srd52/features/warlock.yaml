        - psychic
        - radiant
      when: always
      with: pactWeapon
      oncePerTurn: true
  activations:
    - label: Hit Point Die
      cost: []
      oncePerTurn: true
      trigger:
        afterHit: pactWeapon
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: hitDieHeal
            bonus:
              add:
                - kind: abilityMod
                  ability: con
  prerequisite:
    level: 9
    features:
      - srd52:feature/warlock-pact-of-the-blade
- id: srd52:feature/warlock-mask-of-many-faces
  name: Mask of Many Faces
  text: |-
    Prerequisite: Level 2+ Warlock

    You can cast Disguise Self without expending a spell slot.
  automation: full
  prerequisite:
    level: 2
  spells:
    "1":
      - srd52:spell/disguise-self
  freeCast: atWill
- id: srd52:feature/warlock-master-of-myriad-forms
  name: Master of Myriad Forms
  text: |-
    Prerequisite: Level 5+ Warlock

    You can cast Alter Self without expending a spell slot.
  automation: full
  prerequisite:
    level: 5
  spells:
    "1":
      - srd52:spell/alter-self
  freeCast: atWill
- id: srd52:feature/warlock-misty-visions
  name: Misty Visions
  text: "Prerequisite: Level 2+ Warlock You can cast Silent Image without expending a spell slot."
  automation: full
  prerequisite:
    level: 2
  spells:
    "1":
      - srd52:spell/silent-image
  freeCast: atWill
- id: srd52:feature/warlock-one-with-shadows
  name: One with Shadows
  text: |-
    Prerequisite: Level 5+ Warlock

    While you’re in an area of Dim Light or Darkness, you can cast Invisibility on yourself without expending a spell slot.
  automation: full
  prerequisite:
    level: 5
  spells:
    "1":
      - srd52:spell/invisibility
  freeCast:
    self: true
    whileIn: shadows
- id: srd52:feature/warlock-otherworldly-leap
  name: Otherworldly Leap
  text: |-
    Prerequisite: Level 2+ Warlock

    You can cast Jump on yourself without expending a spell slot.
  automation: full
  prerequisite:
    level: 2
  spells:
    "1":
      - srd52:spell/jump
  freeCast:
    self: true
- id: srd52:feature/warlock-pact-of-the-blade
  name: Pact of the Blade
  text: As a Bonus Action, you can conjure a pact weapon in your hand—a Simple or Martial Melee weapon of your choice with which you bond—or create a bond with a magic weapon you touch; you can’t bond with a magic weapon if someone else is attuned to it or another Warlock is bonded with it. Until the bond ends, you have proficiency with the weapon, and you can use it as a Spellcasting Focus. Whenever you attack with the bonded weapon, you can use your Charisma modifier for the attack and damage rolls instead of using Strength or Dexterity; and you can cause the weapon to deal Necrotic, Psychic, or Radiant damage or its normal damage type. Your bond with the weapon ends if you use this feature’s Bonus Action again, if the weapon is more than 5 feet away from you for 1 minute or more, or if you die. A conjured weapon disappears when the bond ends.
  automation: full
  passives:
    - kind: pactWeapon
    - kind: weaponRider
      with: pactWeapon
      types:
        - necrotic
        - psychic
        - radiant
