        onFail:
          - kind: applyCondition
            condition: incapacitated
            duration:
              until: yourNextTurnEnd
          - kind: modifier
            modifier:
              kind: sealed
            duration:
              until: yourNextTurnEnd
        damage:
          - amount:
              dice: 8d10
            type: psychic
            except:
              - fiend
        onSuccessDamage: none
    - cost:
