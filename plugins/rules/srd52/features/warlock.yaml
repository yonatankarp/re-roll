- id: srd52:feature/warlock-agonizing-blast
  name: Agonizing Blast
  text: |-
    Prerequisite: Level 2+ Warlock, a Warlock Cantrip That Deals Damage

    Choose one of your known Warlock cantrips that deals damage. You can add your Charisma modifier to that spell’s damage rolls. Repeatable. You can gain this invocation more than once. Each time you do so, choose a different eligible cantrip.
  automation: full
  passives:
    - kind: cantripRider
      damage:
        base: 0
        add:
          - kind: abilityMod
            ability: cha
  prerequisite:
    level: 2
    cantrip: damage
- id: srd52:feature/warlock-armor-of-shadows
  name: Armor of Shadows
  text: You can cast Mage Armor on yourself without expending a spell slot.
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: acFormula
        formula:
          base: 13
          add:
            - kind: abilityMod
              ability: dex
- id: srd52:feature/warlock-ascendant-step
  name: Ascendant Step
  text: |-
    Prerequisite: Level 5+ Warlock

    You can cast Levitate on yourself without expending a spell slot.
  automation: full
  prerequisite:
    level: 5
  spells:
    "1":
      - srd52:spell/levitate
  freeCast:
    self: true
- id: srd52:feature/warlock-devil-s-sight
  name: Devil’s Sight
  text: |-
    Prerequisite: Level 2+ Warlock

    You can see normally in Dim Light and Darkness— both magical and nonmagical—within 120 feet of yourself.
  automation: full
  passives:
    - kind: seesInDarkness
      feet: 120
  prerequisite:
    level: 2
- id: srd52:feature/warlock-devouring-blade
  name: Devouring Blade
  text: |-
    Prerequisite: Level 12+ Warlock, Thirsting Blade Invocation

    The Extra Attack of your Thirsting Blade invocation confers two extra attacks rather than one.
  automation: full
  passives:
    - kind: multiattack
      attacks: 3
  prerequisite:
    level: 12
    features:
      - srd52:feature/warlock-thirsting-blade
- id: srd52:feature/warlock-eldritch-mind
  name: Eldritch Mind
  text: You have Advantage on Constitution saving throws that you make to maintain Concentration.
  automation: full
  passives:
    - kind: concentrationAdvantage
- id: srd52:feature/warlock-eldritch-smite
  name: Eldritch Smite
  text: |-
    Prerequisite: Level 5+ Warlock, Pact of the Blade Invocation

    Once per turn when you hit a creature with your pact weapon, you can expend a Pact Magic spell slot to deal an extra 1d8 Force damage to the target,

    plus another 1d8 per level of the spell slot, and you can give the target the Prone condition if it is Huge or smaller.
  automation: full
  resources:
    - id: eldritch-smite
      max:
        base: 1
      recharge:
        - on: turnStart
          amount: all
  activations:
    - cost:
        - slot
        - resource: eldritch-smite
      trigger:
        afterHit: meleeWeapon
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: automatic
        damage:
          - amount:
              dice: 1d8
            type: force
        effects:
          - kind: applyCondition
            condition: prone
            duration:
              until: yourNextTurnStart
            maxSize: huge
  upcast:
    perSlotLevel:
      addDice: 1d8
  prerequisite:
    level: 5
    features:
      - srd52:feature/warlock-pact-of-the-blade
- id: srd52:feature/warlock-eldritch-spear
  name: Eldritch Spear
  text: |-
    Prerequisite: Level 2+ Warlock, a Warlock Cantrip That Deals Damage

    Choose one of your known Warlock cantrips that deals damage and has a range of 10+ feet. When you cast that spell, its range increases by a number of feet equal to 30 times your Warlock level. Repeatable. You can gain this invocation more than once. Each time you do so, choose a different eligible cantrip.
  automation: full
  passives:
    - kind: cantripRider
      rangePerLevel:
        class: srd52:class/warlock
        feet: 30
  prerequisite:
    level: 2
    cantrip: damage
- id: srd52:feature/warlock-fiendish-vigor
  name: Fiendish Vigor
  text: |-
    Prerequisite: Level 2+ Warlock

    You can cast False Life on yourself without expending a spell slot. When you cast the spell with this feature, you don’t roll the die for the Temporary Hit Points; you automatically get the highest number on the die.
  automation: full
  activations:
    - cost:
        - action
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: tempHp
            amount:
              bonus:
                base: 12
  prerequisite:
    level: 2
- id: srd52:feature/warlock-gaze-of-two-minds
  name: Gaze of Two Minds
  text: |-
    Prerequisite: Level 5+ Warlock

    You can use a Bonus Action to touch a willing creature and perceive through its senses until the end of your next turn. As long as the creature is on the same plane of existence as you, you can take a Bonus Action on subsequent turns to maintain this connection, extending the duration until the end of your next turn. The connection ends if you don’t maintain it in this way. While perceiving through the other creature’s senses, you benefit from any special senses possessed by that creature, and you can cast spells as if you were in your space or the other creature’s space if the two of you are within 60 feet of each other.
  automation: full
  prerequisite:
    level: 5
- id: srd52:feature/warlock-gift-of-the-depths
  name: Gift of the Depths
  text: |-
    Prerequisite: Level 5+ Warlock

    You can breathe underwater, and you gain a Swim Speed equal to your Speed. You can also cast Water Breathing once without expending a spell slot. You regain the ability to cast it in this way again when you finish a Long Rest.
  automation: full
  prerequisite:
    level: 5
  spells:
    "1":
      - srd52:spell/water-breathing
  freeCast: true
  passives:
    - kind: modifier
      modifier:
        kind: waterBreathing
    - kind: modifier
      modifier:
        kind: movementMode
        mode: swim
- id: srd52:feature/warlock-gift-of-the-protectors
  name: Gift of the Protectors
  text: |-
    Prerequisite: Level 9+ Warlock, Pact of the Tome Invocation

    A new page appears in your Book of Shadows when you conjure it. With your permission, a creature can take an action to write its name on that page, which can contain a number of names equal to your Charisma modifier (minimum of one name). When any creature whose name is on the page is reduced to 0 Hit Points but not killed outright, the

    creature magically drops to 1 Hit Point instead. Once this magic is triggered, no creature can benefit from it until you finish a Long Rest. As a Magic action, you can erase a name on the page by touching it.
  automation: full
  prerequisite:
    level: 9
    features:
      - srd52:feature/warlock-pact-of-the-tome
  resources:
    - id: gift-of-the-protectors
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
  passives:
    - kind: dropToOne
      resource: gift-of-the-protectors
      allies: true
- id: srd52:feature/warlock-investment-of-the-chain-master
  name: Investment of the Chain Master
  text: |-
    Prerequisite: Level 5+ Warlock, Pact of the Chain Invocation

    When you cast Find Familiar, you infuse the summoned familiar with a measure of your eldritch power, granting the creature the following benefits. Aerial or Aquatic. The familiar gains either a Fly Speed or a Swim Speed (your choice) of 40 feet. Quick Attack. As a Bonus Action, you can command the familiar to take the Attack action. Necrotic or Radiant Damage. Whenever the familiar deals Bludgeoning, Piercing, or Slashing damage, you can make it deal Necrotic or Radiant damage instead. Your Save DC. If the familiar forces a creature to make a saving throw, it uses your spell save DC. Resistance. When the familiar takes damage, you can take a Reaction to grant it Resistance against that damage.
  automation: full
  prerequisite:
    level: 5
    features:
      - srd52:feature/warlock-pact-of-the-chain
  familiar:
    damageTypes:
      - necrotic
      - radiant
    ownerDc: true
    passives:
      - kind: modifier
        modifier:
          kind: movementMode
          mode: fly
          feet: 40
  activations:
    - label: Quick Attack
      cost:
        - bonusAction
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: commandFamiliar
            action: Attack
            range: 100
    - label: Resistance
      cost:
        - reaction
      trigger:
        allyHit: true
        within: 100
      targeting:
        creatures: 1
        range: 100
        side: ally
        creatureTypes:
          - fey
      resolution:
        kind: automatic
        effects:
          - kind: reduceDamage
            halve: true
- id: srd52:feature/warlock-lessons-of-the-first-ones
  name: Lessons of the First Ones
  text: |-
    Prerequisite: Level 2+ Warlock

    You have received knowledge from an elder entity of the multiverse, allowing you to gain one Origin feat of your choice (see “Feats”). Repeatable. You can gain this invocation more than once. Each time you do so, choose a different Origin feat.
  automation: full
  choices:
    - kind: feat
      id: lesson
      category: origin
  prerequisite:
    level: 2
- id: srd52:feature/warlock-lifedrinker
  name: Lifedrinker
  text: |-
    Prerequisite: Level 9+ Warlock, Pact of the Blade Invocation

    Once per turn when you hit a creature with your pact weapon, you can deal an extra 1d6 Necrotic, Psychic, or Radiant damage (your choice) to the creature, and you can expend one of your Hit Point Dice to roll it and regain a number of Hit Points equal to the roll plus your Constitution modifier (minimum of 1 Hit Point).
  automation: full
  passives:
    - kind: extraDamage
      dice: 1d6
      types:
