      oncePerTurn: hurl-through-hell
      trigger:
        afterHit: attack
      targeting:
        creatures: 1
        range: 120
        side: enemy
      resolution:
        kind: save
        ability: cha
        dc:
          add:
            - kind: spellSaveDc
        onFail:
          - kind: applyCondition
            condition: incapacitated
            duration:
              until: yourNextTurnEnd
          - kind: modifier
            modifier:
