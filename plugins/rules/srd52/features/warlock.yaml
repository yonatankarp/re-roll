- id: srd52:feature/warlock-pact-of-the-tome
  name: Pact of the Tome
  text: |-
    Stitching together strands of shadow, you conjure forth a book in your hand at the end of a Short or Long Rest. This Book of Shadows (you determine its appearance) contains eldritch magic that only you can access, granting you the benefits below. The

    book disappears if you conjure another book with this feature or if you die. Cantrips and Rituals. When the book appears, choose three cantrips, and choose two level 1 spells that have the Ritual tag. The spells can be from any class’s spell list, and they must be spells you don’t already have prepared. While the book is on your person, you have the chosen spells prepared, and they function as Warlock spells for you. Spellcasting Focus. You can use the book as a Spellcasting Focus.
  automation: full
  choices:
    - kind: spells
      id: tome-cantrips
      count: 3
      maxLevel: 0
      swap: shortRest
    - kind: spells
      id: tome-rituals
      count: 2
      maxLevel: 1
      ritual: true
      swap: shortRest
- id: srd52:feature/warlock-repelling-blast
  name: Repelling Blast
  text: |-
    Prerequisite: Level 2+ Warlock, a Warlock Cantrip That Deals Damage via an Attack Roll

    Choose one of your known Warlock cantrips that requires an attack roll. When you hit a Large or smaller creature with that cantrip, you can push the creature up to 10 feet straight away from you. Repeatable. You can gain this invocation more than once. Each time you do so, choose a different eligible cantrip.
  automation: full
  passives:
    - kind: cantripRider
      attackOnly: true
      onHit:
        - kind: forcedMove
          feet: 10
          direction: away
          maxSize: large
  prerequisite:
    level: 2
    cantrip: attack
- id: srd52:feature/warlock-thirsting-blade
  name: Thirsting Blade
  text: |-
    Prerequisite: Level 5+ Warlock, Pact of the Blade Invocation

    You gain the Extra Attack feature for your pact weapon only. With that feature, you can attack twice with the weapon instead of once when you take the Attack action on your turn.
  automation: full
  passives:
    - kind: multiattack
      attacks: 2
  prerequisite:
    level: 5
    features:
      - srd52:feature/warlock-pact-of-the-blade
