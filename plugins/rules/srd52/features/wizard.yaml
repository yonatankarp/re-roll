- id: srd52:feature/spell-mastery
  name: Spell Mastery
  text: You have achieved such mastery over certain spells that you can cast them at will. Choose a level 1 and a level 2 spell in your spellbook that have a casting time of an action. You always have those spells prepared, and you can cast them at their lowest level without expending a spell slot. To cast either spell at a higher level, you must expend a spell slot. Whenever you finish a Long Rest, you can study your spellbook and replace one of those spells with an eligible spell of the same level from the book.
  automation: full
- id: srd52:feature/signature-spells
  name: Signature Spells
  text: Choose two level 3 spells in your spellbook as your signature spells. You always have these spells prepared, and you can cast each of them once at level 3 without expending a spell slot. When you do so, you can’t cast them in this way again until you finish a Short or Long Rest. To cast either spell at a higher level, you must expend a spell slot.
  automation: full
- id: srd52:feature/sculpt-spells
  name: Sculpt Spells
  text: You can create pockets of relative safety within the effects of your evocations. When you cast an Evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 plus the spell’s level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.
  automation: full
  passives:
    - kind: sculptor
      creatures: 1
      perLevel: true
      schools:
        - evocation
- id: srd52:feature/empowered-evocation
  name: Empowered Evocation
  text: Whenever you cast a Wizard spell from the Evocation school, you can add your Intelligence modifier to one damage roll of that spell.
  automation: full
  passives:
    - kind: spellDamage
      bonus:
        add:
          - kind: abilityMod
            ability: int
      schools:
        - evocation
      list: srd52:class/wizard
- id: srd52:feature/overchannel
  name: Overchannel
  text: You can increase the power of your spells. When you cast a Wizard spell with a spell slot of levels 1–5 that deals damage, you can deal maximum damage with that spell on the turn you cast it. The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a Long Rest, you take 2d12 Necrotic damage for each level of the spell slot immediately after you cast it. This damage ignores Resistance and Immunity. Each time you use this feature again before finishing a Long Rest, the Necrotic damage per spell level increases by 1d12.
  automation: full
  resources:
    - id: overchannel
      max:
        base: 20
      recharge:
        - on: longRest
          amount: all
  passives:
    - kind: castOption
      label: Overchannel
      list: srd52:class/wizard
      slot: true
      minLevel: 1
      maxLevel: 5
      damaging: true
      maxDamage: true
      escalate:
        resource: overchannel
        dice: 2
        die: 12
        type: necrotic
