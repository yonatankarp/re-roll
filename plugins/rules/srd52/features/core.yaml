- id: "srd52:feature/second-wind"
  name: Second Wind
  text: "As a Bonus Action, regain Hit Points equal to 1d10 plus your Fighter level. You regain one use on a Short Rest, and all on a Long Rest."
  automation: full
  resources:
    - id: second-wind
      max: { add: [{ kind: scaling, key: secondWind }] }
      recharge:
        - { on: shortRest, amount: 1 }
        - { on: longRest, amount: all }
  activations:
    - cost: [bonusAction, { resource: second-wind }]
      targeting: { self: true }
      resolution:
        kind: automatic
        effects:
          - kind: heal
            amount:
              dice: 1d10
              bonus:
                { add: [{ kind: classLevel, class: "srd52:class/fighter" }] }
- id: "srd52:feature/sneak-attack"
  name: Sneak Attack
  text: "Once per turn, deal extra damage to a creature you hit with Advantage, or when an ally is near it. It starts at 1d6 and grows with your Rogue level."
  automation: full
  passives:
    - kind: extraDamage
      dice: 1d6
      diceCount: sneakAttackD6
      when: advantageOrAlly
      oncePerTurn: true

- id: "srd52:feature/fighting-style"
  name: Fighting Style
  text: "You gain a Fighting Style feat of your choice."
  automation: full

- id: "srd52:feature/weapon-mastery"
  name: Weapon Mastery
  text: "You can use the mastery properties of chosen weapons."
  automation: text

- id: "srd52:feature/expertise"
  name: Expertise
  text: "You gain Expertise in two skills you are proficient in."
  automation: text

- id: "srd52:feature/thieves-cant"
  name: Thieves' Cant
  text: "You know Thieves' Cant and one other language."
  automation: text

- id: "srd52:feature/spellcasting"
  name: Spellcasting
  text: "You can cast the spells you have prepared using your spell slots."
  automation: full

- id: "srd52:feature/divine-order"
  name: Divine Order
  text: "You dedicate yourself to a sacred role of your choice."
  automation: text

- id: "srd52:feature/ritual-adept"
  name: Ritual Adept
  text: "You can cast spells in your spellbook as Rituals."
  automation: full
  passives: [{ kind: ritualAdept, list: srd52:class/wizard }]

- id: "srd52:feature/arcane-recovery"
  name: Arcane Recovery
  text: "You can recover some spell slots when you finish a Short Rest."
  automation: full
  resources:
    - id: arcane-recovery
      max: { base: 1 }
      recharge: [{ on: longRest, amount: all }]
  passives:
    - kind: slotRecovery
      levels:
        {
          add:
            [
              {
                kind: classLevel,
                class: "srd52:class/wizard",
                half: true,
                roundUp: true,
              },
            ],
        }
      resource: arcane-recovery

- id: "srd52:feature/human-traits"
  name: Human Traits
  text: "Resourceful, Skillful and Versatile."
  automation: text

- id: "srd52:feature/savage-attacker"
  name: Savage Attacker
  text: "Once per turn, roll a weapon's damage dice twice and use either roll."
  automation: full
  passives:
    - { kind: savageAttacker }

- id: "srd52:feature/alert"
  name: Alert
  text: "Add your Proficiency Bonus to Initiative, and you may swap Initiative with an ally."
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: bonus
        to: initiative
        amount: { bonus: { add: [{ kind: proficiency }] } }
  activations:
    - cost: []
      trigger: { initiative: true }
      targeting: { self: true }
      resolution: { kind: automatic, effects: [{ kind: swapInitiative }] }

- id: "srd52:feature/magic-initiate"
  name: Magic Initiate
  text: "You learn two cantrips and one level 1 spell from a chosen list."
  automation: full

- id: "srd52:feature/dwarf-traits"
  name: Dwarf Traits
  text: "Darkvision, Dwarven Resilience, Dwarven Toughness and Stonecunning."
  automation: text

- id: "srd52:feature/elf-traits"
  name: Elf Traits
  text: "Darkvision, Elven Lineage, Fey Ancestry, Keen Senses and Trance."
  automation: text

- id: "srd52:feature/ability-score-improvement"
  name: Ability Score Improvement
  text: "You gain the Ability Score Improvement feat or another feat you qualify for."
  automation: full

- id: "srd52:feature/extra-attack"
  name: Extra Attack
  text: "You can attack twice instead of once whenever you take the Attack action."
  automation: full

- id: "srd52:feature/action-surge"
  name: Action Surge
  text: "Once between rests, you can take one additional action on your turn."
  automation: full
  resources:
    - id: action-surge
      max: { base: 1 }
      recharge: [{ on: shortRest, amount: all }, { on: longRest, amount: all }]
  activations:
    - cost: [{ resource: action-surge }]
      targeting: { self: true }
      resolution: { kind: automatic, effects: [{ kind: extraAction }] }

- id: "srd52:feature/tactical-mind"
  name: Tactical Mind
  text: "You can spend a use of Second Wind to add 1d10 to a failed ability check."
  automation: full
  passives:
    - { kind: checkRescue, bonusDice: 1d10, resource: second-wind, keep: true }

- id: "srd52:feature/fighter-subclass"
  name: Fighter Subclass
  text: "You gain a Fighter subclass of your choice."
  automation: full

- id: "srd52:feature/tactical-shift"
  name: Tactical Shift
  text: "When you use Second Wind, you can move up to half your Speed without provoking Opportunity Attacks."
  automation: full
  passives:
    - kind: activationRider
      feature: "srd52:feature/second-wind"
      effects: [{ kind: dash, half: true, safe: true }]

- id: "srd52:feature/improved-critical"
  name: Improved Critical
  text: "Your weapon attacks score a Critical Hit on a roll of 19 or 20."
  automation: text

- id: "srd52:feature/remarkable-athlete"
  name: Remarkable Athlete
  text: "You have Advantage on Initiative rolls and Strength (Athletics) checks."
  automation: partial
  # shortcut: the move after a Critical Hit isn't given.
  passives:
    - { kind: initiativeAdvantage }
    - kind: modifier
      modifier: { kind: advantage, on: checks, skills: [athletics] }

- id: "srd52:feature/cunning-action"
  name: Cunning Action
  text: "You can Dash, Disengage or Hide as a Bonus Action."
  automation: full
  passives:
    - { kind: bonusTactics, tactics: [dash, disengage, hide] }

- id: "srd52:feature/rogue-subclass"
  name: Rogue Subclass
  text: "You gain a Rogue subclass of your choice."
  automation: full

- id: "srd52:feature/steady-aim"
  name: Steady Aim
  text: "As a Bonus Action, give yourself Advantage on your next attack if you haven't moved this turn."
  automation: full
  activations:
    - cost: [bonusAction]
      unmoved: true
      targeting: { self: true }
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier: { kind: advantage, on: attacks, once: true }
            duration: { until: turnEnd }
          - kind: modifier
            modifier: { kind: actionLimit, speed: none }
            duration: { until: turnEnd }

- id: "srd52:feature/cunning-strike"
  name: Cunning Strike
  text: "You can trade Sneak Attack dice for effects when you hit, such as poisoning or tripping the target."
  automation: full
  activations:
    - label: Poison
      cost: []
      trigger: { afterHit: weapon, forgo: 1 }
      targeting: { creatures: 1, range: 120, side: enemy }
      resolution:
        kind: save
        ability: con
        dc:
          {
            base: 8,
            add: [{ kind: proficiency }, { kind: abilityMod, ability: dex }],
          }
        onFail:
          - {
              kind: applyCondition,
              condition: poisoned,
              duration: { minutes: 1 },
              repeatSave: true,
            }
    - label: Trip
      cost: []
      trigger: { afterHit: weapon, forgo: 1 }
      targeting: { creatures: 1, range: 120, side: enemy, maxSize: large }
      resolution:
        kind: save
        ability: dex
        dc:
          {
            base: 8,
            add: [{ kind: proficiency }, { kind: abilityMod, ability: dex }],
          }
        onFail:
          - { kind: applyCondition, condition: prone, duration: { minutes: 1 } }
    - label: Withdraw
      cost: []
      trigger: { afterHit: weapon, forgo: 1 }
      targeting: { creatures: 1, range: 120, side: enemy }
      resolution: { kind: automatic, effects: [] }
      selfEffects: [{ kind: dash, half: true, safe: true }]

- id: "srd52:feature/uncanny-dodge"
  name: Uncanny Dodge
  text: "When an attacker you can see hits you, you can use your Reaction to halve the damage."
  automation: full
  activations:
    - cost: [reaction]
      trigger: { hitByAttack: true }
      targeting: { self: true }
      resolution:
        kind: automatic
        effects:
          - { kind: reduceDamage, halve: true }

- id: "srd52:feature/fast-hands"
  name: Fast Hands
  text: "You can use Cunning Action for Sleight of Hand, thieves' tools or a Magic item."
  automation: full
  passives:
    - { kind: fastHands }

- id: "srd52:feature/second-story-work"
  name: Second-Story Work
  text: "You gain a Climb Speed, and you can jump farther using Dexterity."
  automation: full
  passives:
    - { kind: modifier, modifier: { kind: movementMode, mode: climb } }
    - { kind: jump, ability: dex }

- id: "srd52:feature/channel-divinity"
  name: Channel Divinity
  text: "You can channel divine energy for effects such as Divine Spark and Turn
    Undead."
  automation: full
  resources:
    - id: cleric-channel-divinity
      max: { base: 0, add: [{ kind: scaling, key: channelDivinity }] }
      recharge: [{ on: shortRest, amount: 1 }, { on: longRest, amount: all }]
  activations:
    - cost:
        - action
        - resource: cleric-channel-divinity
      label: Divine Spark
      targeting:
        creatures: 1
        range: 30
        side: ally
      resolution:
        kind: automatic
        effects:
          - kind: heal
            amount:
              dice: 1d8
              bonus:
                add:
                  - kind: abilityMod
                    ability: wis
    - cost:
        - action
        - resource: cleric-channel-divinity
      label: Divine Spark, Radiant
      targeting:
        creatures: 1
        range: 30
        side: enemy
      resolution:
        kind: save
        ability: con
        dc:
          base: 0
          add:
            - kind: spellSaveDc
        damage:
          - amount:
              dice: 1d8
              bonus:
                add:
                  - kind: abilityMod
                    ability: wis
            type: radiant
        onSuccessDamage: half
    - cost:
        - action
        - resource: cleric-channel-divinity
      label: Divine Spark, Necrotic
      targeting:
        creatures: 1
        range: 30
        side: enemy
      resolution:
        kind: save
        ability: con
        dc:
          base: 0
          add:
            - kind: spellSaveDc
        damage:
          - amount:
              dice: 1d8
              bonus:
                add:
                  - kind: abilityMod
                    ability: wis
            type: necrotic
        onSuccessDamage: half
    - cost:
        - action
        - resource: cleric-channel-divinity
      label: Turn Undead
      targeting:
        area:
          shape: emanation
          radius: 30
        range: self
        side: enemy
        creatureTypes:
          - undead
        choice: true
      resolution:
        kind: save
        ability: wis
        dc:
          base: 0
          add:
            - kind: spellSaveDc
        damage: []
        onSuccessDamage: none
        onFail:
          - kind: applyCondition
            condition: frightened
            duration:
              minutes: 1
            endsOnDamage: true
            flee:
              casterDown: true
          - kind: applyCondition
            condition: incapacitated
            duration:
              minutes: 1
            endsOnDamage: true
        onSuccess: []

- id: "srd52:feature/cleric-subclass"
  name: Cleric Subclass
  text: "You gain a Cleric subclass of your choice."
  automation: full

- id: "srd52:feature/sear-undead"
  name: Sear Undead
  text:
    "When you use Turn Undead, you can deal Radiant damage to the Undead that
    fail the save."
  automation: full
  passives:
    - kind: activationRider
      feature: srd52:feature/channel-divinity
      label: Turn Undead
      damage:
        - amount:
            dice: 1d8
            diceCount: mod:wis
          type: radiant

- id: "srd52:feature/disciple-of-life"
  name: Disciple of Life
  text: "Your healing spells restore additional Hit Points based on the slot used."
  automation: full
  passives:
    - { kind: spellHealing, bonus: { base: 2 }, perSlot: true, slot: true }

- id: "srd52:feature/preserve-life"
  name: Preserve Life
  text: "As a Magic action, use Channel Divinity to divide healing among Bloodied creatures near you."
  automation: full
  activations:
    - cost: [action, { resource: cleric-channel-divinity }]
      targeting: { creatures: 20, range: 30, side: ally, bloodied: true }
      resolution:
        kind: automatic
        effects:
          - kind: heal
            amount:
              {
                bonus:
                  {
                    add:
                      [
                        {
                          kind: classLevel,
                          class: "srd52:class/cleric",
                          times: 5,
                        },
                      ],
                  },
              }
            divided: true
            half: true

- id: "srd52:feature/scholar"
  name: Scholar
  text: "You gain Expertise in one of your scholarly skills, such as Arcana or History."
  automation: text

- id: "srd52:feature/wizard-subclass"
  name: Wizard Subclass
  text: "You gain a Wizard subclass of your choice."
  automation: full

- id: "srd52:feature/memorize-spell"
  name: Memorize Spell
  text: "When you finish a Short Rest, you can swap one prepared spell for another in your spellbook."
  automation: full
  passives:
    - { kind: memorize, class: wizard }

- id: "srd52:feature/evocation-savant"
  name: Evocation Savant
  text: "You add two Evocation spells to your spellbook for free, and another with each new spell level."
  automation: full
  # The spellbook is the whole Wizard list here (swap.ts), so the free spells are already in it.

- id: "srd52:feature/potent-cantrip"
  name: Potent Cantrip
  text: "A creature that saves against your damaging cantrip still takes half its damage."
  automation: full
  passives: [{ kind: potentCantrip }]
