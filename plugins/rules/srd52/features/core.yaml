- id: "srd52:feature/second-wind"
  name: Second Wind
  text: "As a Bonus Action, regain Hit Points equal to 1d10 plus your Fighter level. You regain one use on a Short Rest, and all on a Long Rest."
  automation: full
  resources:
    - id: second-wind
      max: { add: [{ kind: scaling, key: secondWind }] }
      recharge:
        - { on: shortRest, amount: 1 }
        - { on: longRest, amount: all }
  activations:
    - cost: [bonusAction, { resource: second-wind }]
      targeting: { self: true }
      resolution:
        kind: automatic
        effects:
          - kind: heal
            amount:
              dice: 1d10
              bonus:
                { add: [{ kind: classLevel, class: "srd52:class/fighter" }] }
- id: "srd52:feature/sneak-attack"
  name: Sneak Attack
  text: "Once per turn, deal extra damage to a creature you hit with Advantage, or when an ally is near it. It starts at 1d6 and grows with your Rogue level."
  automation: partial
  passives:
    - kind: extraDamage
      dice: 1d6
      diceCount: sneakAttackD6
      when: advantageOrAlly
      oncePerTurn: true

