- id: srd52:feature/martial-arts
  name: Martial Arts
  text: |-
    Your practice of martial arts gives you mastery of combat styles that use your Unarmed Strike and Monk weapons, which are the following: • Simple Melee weapons • Martial Melee weapons that have the Light property

    You gain the following benefits while you are unarmed or wielding only Monk weapons and you aren’t wearing armor or wielding a Shield. Bonus Unarmed Strike. You can make an Unarmed Strike as a Bonus Action. Martial Arts Die. You can roll 1d6 in place of the normal damage of your Unarmed Strike or Monk weapons. This die changes as you gain Monk levels, as shown in the Martial Arts column of the Monk Features table. Dexterous Attacks. You can use your Dexterity modifier instead of your Strength modifier for the attack and damage rolls of your Unarmed Strikes and Monk weapons. In addition, when you use the Grapple or Shove option of your Unarmed Strike, you can use your Dexterity modifier instead of your Strength modifier to determine the save DC.

    +10 ft.

    +10 ft.

    +10 ft.

    +10 ft.

    +15 ft.

    +15 ft.

    +15 ft.

    +15 ft.

    +20 ft.

    +20 ft.

    +20 ft.

    +20 ft.

    +25 ft.

    +25 ft.

    +25 ft.

    +25 ft.

    +30 ft.

    +30 ft.

    +30 ft.
  automation: full
  activations:
    - cost:
        - action
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: attack
        attack:
          type: weapon
          ability: dex
          unarmed: true
        damage:
          - amount:
              dice: 1d6
              dieSize: martialArtsDie
              bonus:
                add:
                  - kind: abilityMod
                    ability: dex
            type: bludgeoning
    - cost:
        - bonusAction
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: attack
        attack:
          type: weapon
          ability: dex
          unarmed: true
        damage:
          - amount:
              dice: 1d6
              dieSize: martialArtsDie
              bonus:
                add:
                  - kind: abilityMod
                    ability: dex
            type: bludgeoning
  passives:
    - kind: weaponRider
      with: monkWeapon
      ability: dex
      dieAtLeast: martialArtsDie
      armor: none
- id: srd52:feature/monk-unarmored-defense
  name: Unarmored Defense
  text: While you aren’t wearing armor or wielding a Shield, your base Armor Class equals 10 plus your Dexterity and Wisdom modifiers.
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: acFormula
        unarmored: true
        noShield: true
        formula:
          base: 10
          add:
            - kind: abilityMod
              ability: dex
            - kind: abilityMod
              ability: wis
- id: srd52:feature/monk-s-focus
  name: Monk’s Focus
  text: "Your focus and martial training allow you to harness a well of extraordinary energy within yourself. This energy is represented by Focus Points. Your Monk level determines the number of points you have, as shown in the Focus Points column of the Monk Features table. You can expend these points to enhance or fuel certain Monk features. You start knowing three such features: Flurry of Blows, Patient Defense, and Step of the Wind, each of which is detailed below. When you expend a Focus Point, it is unavailable until you finish a Short or Long Rest, at the end of which you regain all your expended points. Some features that use Focus Points require your target to make a saving throw. The save DC equals 8 plus your Wisdom modifier and Proficiency Bonus. Flurry of Blows. You can expend 1 Focus Point to make two Unarmed Strikes as a Bonus Action. Patient Defense. You can take the Disengage action as a Bonus Action. Alternatively, you can expend 1 Focus Point to take both the Disengage and the Dodge actions as a Bonus Action. Step of the Wind. You can take the Dash action as a Bonus Action. Alternatively, you can expend 1 Focus Point to take both the Disengage and Dash actions as a Bonus Action, and your jump distance is doubled for the turn."
  automation: full
  passives:
    - kind: bonusTactics
      tactics:
        - disengage
        - dash
  resources:
    - id: focus-points
      max:
        base: 0
        add:
          - kind: scaling
            key: focusPoints
      recharge:
        - on: shortRest
          amount: all
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: focus-points
      label: Flurry of Blows
      projectiles: 2
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: attack
        attack:
          type: weapon
          ability: dex
          unarmed: true
        damage:
          - amount:
              dice: 1d6
              dieSize: martialArtsDie
              bonus:
                add:
                  - kind: abilityMod
                    ability: dex
            type: bludgeoning
    - cost:
        - bonusAction
        - resource: focus-points
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: disengage
          - kind: dodge
      label: Patient Defense
    - cost:
        - bonusAction
        - resource: focus-points
      label: Step of the Wind
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: disengage
          - kind: dash
- id: srd52:feature/unarmored-movement
  name: Unarmored Movement
  text: Your speed increases by 10 feet while you aren’t wearing armor or wielding a Shield. This bonus increases when you reach certain Monk levels, as shown on the Monk Features table.
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: bonus
        to: speed
        amount:
          bonus:
            base: 0
            add:
              - kind: scaling
                key: unarmoredMovement
      armor: none
- id: srd52:feature/uncanny-metabolism
  name: Uncanny Metabolism
  text: When you roll Initiative, you can regain all expended Focus Points. When you do so, roll your Martial Arts die, and regain a number of Hit Points equal to your Monk level plus the number rolled. Once you use this feature, you can’t use it again until you finish a Long Rest.
  automation: full
  resources:
    - id: uncanny-metabolism
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
    - id: focus-points
      max:
        base: 0
        add:
          - kind: scaling
            key: focusPoints
      recharge:
        - on: initiative
          amount: all
          uses: uncanny-metabolism
          heal:
            dice: 1d6
            dieSize: martialArtsDie
            bonus:
              add:
                - kind: classLevel
                  class: srd52:class/monk
- id: srd52:feature/deflect-attacks
  name: Deflect Attacks
  text: When an attack roll hits you and its damage includes Bludgeoning, Piercing, or Slashing damage, you can take a Reaction to reduce the attack’s total damage against you. The reduction equals 1d10 plus your Dexterity modifier and Monk level. If you reduce the damage to 0, you can expend 1 Focus Point to redirect some of the attack’s force. If you do so, choose a creature you can see within 5 feet of yourself if the attack was a melee attack or a creature you can see within 60 feet of yourself that isn’t behind Total Cover if the attack was a ranged attack. That creature must succeed on a Dexterity saving throw or take damage equal to two rolls of your Martial Arts die plus your Dexterity modifier. The damage is the same type dealt by the attack.
  automation: full
  activations:
    - cost:
        - reaction
      label: Deflect Attacks
      trigger:
        hitByAttack: true
        damagedBy:
          - bludgeoning
          - piercing
          - slashing
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: reduceDamage
            amount:
              dice: 1d10
              bonus:
                add:
                  - kind: abilityMod
                    ability: dex
                  - kind: classLevel
                    class: srd52:class/monk
            deflect:
              range: 60
              melee: 5
              ability: dex
              dc:
                base: 8
                add:
                  - kind: abilityMod
                    ability: dex
                  - kind: proficiency
              damage:
                - amount:
                    dice: 2d6
                    dieSize: martialArtsDie
                    bonus:
                      add:
                        - kind: abilityMod
                          ability: dex
                  type: bludgeoning
              resource: focus-points
              sameType: true
- id: srd52:feature/monk-subclass
  name: Monk Subclass
  text: You gain a Monk subclass of your choice. The Warrior of the Open Hand subclass is detailed after this class’s description. A subclass is a specialization that grants you features at certain Monk levels. For the rest of your career, you gain each of your subclass’s features that are of your Monk level or lower.
  automation: full
- id: srd52:feature/slow-fall
  name: Slow Fall
  text: You can take a Reaction when you fall to reduce any damage you take from the fall by an amount equal to five times your Monk level.
  automation: full
  activations:
    - cost:
        - reaction
      trigger:
        falls: true
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: slowFall
            creatures: 1
            reduce:
              base: 0
              add:
                - kind: classLevel
                  class: srd52:class/monk
                  times: 5
- id: srd52:feature/stunning-strike
  name: Stunning Strike
  text: Once per turn when you hit a creature with a Monk weapon or an Unarmed Strike, you can expend 1 Focus Point to attempt a stunning strike. The target must make a Constitution saving throw. On a failed save, the target has the Stunned condition until the start of your next turn. On a successful save, the target’s Speed is halved until the start of your next turn, and the next attack roll made against the target before then has Advantage.
  automation: full
  activations:
    - cost:
        - resource: focus-points
      oncePerTurn: true
      trigger:
        afterHit: monkWeapon
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: save
        ability: con
        dc:
          base: 8
          add:
            - kind: proficiency
            - kind: abilityMod
              ability: wis
        onFail:
          - kind: applyCondition
            condition: stunned
            duration:
              until: yourNextTurnStart
        onSuccess:
          - kind: modifier
            modifier:
              kind: actionLimit
              speed: half
            duration:
              until: yourNextTurnStart
          - kind: modifier
            modifier:
              kind: advantage
              on: attacksAgainst
              once: true
            duration:
              until: yourNextTurnStart
- id: srd52:feature/empowered-strikes
  name: Empowered Strikes
  text: Whenever you deal damage with your Unarmed Strike, it can deal your choice of Force damage or its normal damage type.
  automation: full
  passives:
    - kind: weaponRider
      with: unarmed
      types:
        - force
- id: srd52:feature/acrobatic-movement
  name: Acrobatic Movement
  text: While you aren’t wearing armor or wielding a Shield, you gain the ability to move along vertical surfaces and across liquids on your turn without falling during the movement.
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: movementMode
        mode: climb
      armor: none
    - kind: modifier
      modifier:
        kind: waterWalk
      armor: none
- id: srd52:feature/heightened-focus
  name: Heightened Focus
  text: |-
    Your Flurry of Blows, Patient Defense, and Step of the Wind gain the following benefits. Flurry of Blows. You can expend 1 Focus Point to use Flurry of Blows and make three Unarmed Strikes with it instead of two.

    Patient Defense. When you expend a Focus Point to use Patient Defense, you gain a number of Temporary Hit Points equal to two rolls of your Martial Arts die. Step of the Wind. When you expend a Focus Point to use Step of the Wind, you can choose a willing creature within 5 feet of yourself that is Large or smaller. You move the creature with you until the end of your turn. The creature’s movement doesn’t provoke Opportunity Attacks.
  automation: full
  activations:
    - cost:
        - bonusAction
        - resource: focus-points
      label: Flurry of Blows
      projectiles: 3
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: attack
        attack:
          type: weapon
          ability: dex
        damage:
          - amount:
              dice: 1d6
              dieSize: martialArtsDie
              bonus:
                add:
                  - kind: abilityMod
                    ability: dex
            type: bludgeoning
    - cost:
        - bonusAction
        - resource: focus-points
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: tempHp
            amount:
              dice: 2d6
              dieSize: martialArtsDie
          - kind: disengage
          - kind: dodge
      label: Patient Defense
    - cost:
        - bonusAction
        - resource: focus-points
      label: Step of the Wind
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: disengage
          - kind: dash
    - cost:
        - bonusAction
        - resource: focus-points
      label: Step of the Wind, carrying an ally
      targeting:
        creatures: 1
        range: 5
        side: ally
        maxSize: large
      alsoSelf:
        - kind: disengage
        - kind: dash
      resolution:
        kind: automatic
        effects:
          - kind: carry
- id: srd52:feature/self-restoration
  name: Self-Restoration
  text: "Through sheer force of will, you can remove one of the following conditions from yourself at the end of each of your turns: Charmed, Frightened, or Poisoned. In addition, forgoing food and drink doesn’t give you levels of Exhaustion."
  automation: full
  passives:
    - kind: shakeOff
      conditions:
        - charmed
        - frightened
        - poisoned
- id: srd52:feature/deflect-energy
  name: Deflect Energy
  text: You can now use your Deflect Attacks feature against attacks that deal any damage type, not just Bludgeoning, Piercing, or Slashing.
  automation: full
  overrides:
    feature: srd52:feature/deflect-attacks
    labels:
      - Deflect Attacks
  activations:
    - cost:
        - reaction
      label: Deflect Attacks
      trigger:
        hitByAttack: true
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: reduceDamage
            amount:
              dice: 1d10
              bonus:
                add:
                  - kind: abilityMod
                    ability: dex
                  - kind: classLevel
                    class: srd52:class/monk
            deflect:
              range: 60
              melee: 5
              ability: dex
              dc:
                base: 8
                add:
                  - kind: abilityMod
                    ability: dex
                  - kind: proficiency
              damage:
                - amount:
                    dice: 2d6
                    dieSize: martialArtsDie
                    bonus:
                      add:
                        - kind: abilityMod
                          ability: dex
                  type: bludgeoning
              resource: focus-points
              sameType: true
- id: srd52:feature/disciplined-survivor
  name: Disciplined Survivor
  text: Your physical and mental discipline grant you proficiency in all saving throws. Additionally, whenever you make a saving throw and fail, you can expend 1 Focus Point to reroll it, and you must use the new roll.
  automation: full
  passives:
    - kind: saveProficiency
      abilities:
        - str
        - dex
        - con
        - int
        - wis
        - cha
  activations:
    - cost:
        - resource: focus-points
      trigger:
        rolled:
          rolls:
            - save
          by: self
          when: failed
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: reroll
- id: srd52:feature/perfect-focus
  name: Perfect Focus
  text: When you roll Initiative and don’t use Uncanny Metabolism, you regain expended Focus Points until you have 4 if you have 3 or fewer.
  automation: full
  resources:
    - id: focus-points
      max:
        base: 0
        add:
          - kind: scaling
            key: focusPoints
      recharge:
        - on: initiative
          amount: all
          upTo: 4
- id: srd52:feature/superior-defense
  name: Superior Defense
  text: At the start of your turn, you can expend 3 Focus Points to bolster yourself against harm for 1 minute or until you have the Incapacitated condition. During that time, you have Resistance to all damage except Force damage.
  automation: full
  activations:
    - cost:
        - resource: focus-points
          count: 3
      label: Superior Defense
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: resistance
              damage: acid
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: bludgeoning
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: cold
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: fire
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: lightning
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: necrotic
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: piercing
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: poison
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: psychic
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: radiant
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: slashing
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: resistance
              damage: thunder
            duration:
              minutes: 1
- id: srd52:feature/body-and-mind
  name: Body and Mind
  text: You have developed your body and mind to new heights. Your Dexterity and Wisdom scores increase by 4, to a maximum of 25.
  automation: full
  passives:
    - kind: scoreIncrease
      abilities:
        - dex
        - wis
      amount: 4
      max: 25
- id: srd52:feature/open-hand-technique
  name: Open Hand Technique
  text: Whenever you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on that target. Addle. The target can’t make Opportunity Attacks until the start of its next turn. Push. The target must succeed on a Strength saving throw or be pushed up to 15 feet away from you. Topple. The target must succeed on a Dexterity saving throw or have the Prone condition.
  automation: full
  activations:
    - label: Addle
      cost: []
      trigger:
        afterHit: unarmed
        withFeature: srd52:feature/monk-s-focus
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: actionLimit
              noOpportunityAttacks: true
            duration:
              until: itsNextTurnStart
    - label: Push
      cost: []
      trigger:
        afterHit: unarmed
        withFeature: srd52:feature/monk-s-focus
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: save
        ability: str
        dc:
          base: 8
          add:
            - kind: proficiency
            - kind: abilityMod
              ability: wis
        onFail:
          - kind: forcedMove
            feet: 15
            direction: away
    - label: Topple
      cost: []
      trigger:
        afterHit: unarmed
        withFeature: srd52:feature/monk-s-focus
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: save
        ability: dex
        dc:
          base: 8
          add:
            - kind: proficiency
            - kind: abilityMod
              ability: wis
        onFail:
          - kind: applyCondition
            condition: prone
            duration:
              minutes: 1
- id: srd52:feature/wholeness-of-body
  name: Wholeness of Body
  text: You gain the ability to heal yourself. As a Bonus Action, you can roll your Martial Arts die. You regain a number of Hit Points equal to the number rolled plus your Wisdom modifier (minimum of 1 Hit Point regained). You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.
  automation: full
  resources:
    - id: wholeness-of-body
      max:
        base: 0
        add:
          - kind: abilityMod
            ability: wis
        min: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: wholeness-of-body
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: heal
            amount:
              dice: 1d6
              dieSize: martialArtsDie
              bonus:
                add:
                  - kind: abilityMod
                    ability: wis
                min: 1
- id: srd52:feature/fleet-step
  name: Fleet Step
  text: When you take a Bonus Action other than Step of the Wind, you can also use Step of the Wind immediately after that Bonus Action.
  automation: full
  resources:
    - id: fleet-step
      max:
        base: 1
      recharge:
        - on: turnStart
          amount: all
  activations:
    - cost:
        - resource: fleet-step
      afterBonusAction: true
      label: Dash
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: dash
    - cost:
        - resource: fleet-step
        - resource: focus-points
      afterBonusAction: true
      label: Disengage and Dash
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: disengage
          - kind: dash
- id: srd52:feature/quivering-palm
  name: Quivering Palm
  text: You gain the ability to set up lethal vibrations in someone’s body. When you hit a creature with an Unarmed Strike, you can expend 4 Focus Points to start these imperceptible vibrations, which last for a number of days equal to your Monk level. The vibrations are harmless unless you take an action to end them. Alternatively, when you take the Attack action on your turn, you can forgo one of the attacks to end the vibrations. To end them, you and the target must be on the same plane of existence. When you end them, the target must make a Constitution saving throw, taking 10d12 Force damage on a failed save or half as much damage on a successful one. You can have only one creature under the effect of this feature at a time. You can end the vibrations harmlessly (no action required).
  automation: full
  passives:
    - kind: attackReplacement
      attacks: 1
      feature: srd52:feature/quivering-palm
  activations:
    - label: Vibrations
      cost:
        - resource: focus-points
          count: 4
      trigger:
        afterHit: unarmed
      oneTarget: true
      targeting:
        creatures: 1
        range: 5
        side: enemy
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: mark
            duration:
              until: rest
    - label: End
      cost:
        - action
      endsAffliction: true
      targeting:
        creatures: 1
        range: 1000
        side: enemy
        afflicted: Quivering Palm (Vibrations)
      resolution:
        kind: save
        ability: con
        dc:
          base: 8
          add:
            - kind: proficiency
            - kind: abilityMod
              ability: wis
        onFail: []
        damage:
          - amount:
              dice: 10d12
            type: force
        onSuccessDamage: half
