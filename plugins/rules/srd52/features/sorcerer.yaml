- id: srd52:feature/dragon-wings
  name: Dragon Wings
  text: As a Bonus Action, you can cause draconic wings to appear on your back. The wings last for 1 hour or until you dismiss them (no action required). For the duration, you have a Fly Speed of 60 feet. Once you use this feature, you can’t use it again until you finish a Long Rest unless you spend 3 Sorcery Points (no action required) to restore your use of it.
  automation: full
  resources:
    - id: dragon-wings
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: dragon-wings
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: movementMode
              mode: fly
              feet: 60
            duration:
              minutes: 60
    - label: a use back
      cost:
        - resource: sorcery-points
          count: 3
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: regain
            resource: dragon-wings
- id: srd52:feature/dragon-companion
  name: Dragon Companion
  text: |-
    You can cast Summon Dragon without a Material component. You can also cast it once without a spell slot, and you regain the ability to cast it in this way when you finish a Long Rest. Whenever you start casting the spell, you can modify it so that it doesn’t require Concentration. If you do so, the spell’s duration becomes 1 minute for that casting.

    Warlock Core Warlock Traits Primary Ability

    Choose 2: Arcana, Deception, History, Intimidation, Investigation, Nature, or Religion

    Weapon Proficiencies Simple weapons Armor Training

    Choose A or B: (A) Leather Armor, Sickle, 2 Daggers, Arcane Focus (orb), Book (occult lore), Scholar’s Pack, and 15 GP; or (B) 100 GP

    Becoming a Warlock … As a Level 1 Character • Gain all the traits in the Core Warlock Traits table. • Gain the Warlock’s level 1 features, which are listed in the Warlock Features table.

    • Gain the following traits from the Core Warlock Traits table: Hit Point Die and training with Light armor. • Gain the Warlock’s level 1 features, which are listed in the Warlock Features table. See the multiclassing rules in “Character Creation” to determine your available spell slots.

    As a Warlock, you gain the following class features when you reach the specified Warlock levels. These features are listed in the Warlock Features table.
  automation: full
  spells:
    "18":
      - srd52:spell/summon-dragon
  freeCast: true
- id: srd52:feature/metamagic-careful-spell
  name: Careful Spell
  text: |-
    When you cast a spell that forces other creatures to make a saving throw, you can protect some of those creatures from the spell’s full force. To do so, spend 1 Sorcery Point and choose a number of those creatures up to your Charisma modifier (minimum of one creature). A chosen creature automatically succeeds on its saving throw against the spell, and

    it takes no damage if it would normally take half damage on a successful save.
  automation: full
- id: srd52:feature/metamagic-distant-spell
  name: Distant Spell
  text: When you cast a spell that has a range of at least 5 feet, you can spend 1 Sorcery Point to double the spell’s range. Or when you cast a spell that has a range of Touch, you can spend 1 Sorcery Point to make the spell’s range 30 feet.
  automation: full
- id: srd52:feature/metamagic-empowered-spell
  name: Empowered Spell
  text: When you roll damage for a spell, you can spend 1 Sorcery Point to reroll a number of the damage dice up to your Charisma modifier (minimum of one), and you must use the new rolls. You can use Empowered Spell even if you’ve already used a different Metamagic option during the casting of the spell.
  automation: full
- id: srd52:feature/metamagic-extended-spell
  name: Extended Spell
  text: When you cast a spell that has a duration of 1 minute or longer, you can spend 1 Sorcery Point to double its duration to a maximum duration of 24 hours. If the affected spell requires Concentration, you have Advantage on any saving throw you make to maintain that Concentration.
  automation: full
- id: srd52:feature/metamagic-heightened-spell
  name: Heightened Spell
  text: When you cast a spell that forces a creature to make a saving throw, you can spend 2 Sorcery Points to give one target of the spell Disadvantage on saves against the spell.
  automation: full
- id: srd52:feature/metamagic-quickened-spell
  name: Quickened Spell
  text: When you cast a spell that has a casting time of an action, you can spend 2 Sorcery Points to change the casting time to a Bonus Action for this casting. You can’t modify a spell in this way if you’ve already cast a level 1+ spell on the current turn, nor can you cast a level 1+ spell on this turn after modifying a spell in this way.
  automation: full
- id: srd52:feature/metamagic-seeking-spell
  name: Seeking Spell
  text: If you make an attack roll for a spell and miss, you can spend 1 Sorcery Point to reroll the d20, and you must use the new roll. You can use Seeking Spell even if you’ve already used a different Metamagic option during the casting of the spell.
  automation: full
- id: srd52:feature/metamagic-subtle-spell
  name: Subtle Spell
  text: "Cost: 1 Sorcery Point When you cast a spell, you can spend 1 Sorcery Point to cast it without any Verbal, Somatic, or Material components, except Material components that are consumed by the spell or that have a cost specified in the spell."
  automation: full
- id: srd52:feature/metamagic-transmuted-spell
  name: Transmuted Spell
  text: "When you cast a spell that deals a type of damage from the following list, you can spend 1 Sorcery Point to change that damage type to one of the other listed types: Acid, Cold, Fire, Lightning, Poison, Thunder."
  automation: full
- id: srd52:feature/metamagic-twinned-spell
  name: Twinned Spell
  text: When you cast a spell, such as Charm Person, that can be cast with a higher-level spell slot to target an additional creature, you can spend 1 Sorcery Point to increase the spell’s effective level by 1.
  automation: full
