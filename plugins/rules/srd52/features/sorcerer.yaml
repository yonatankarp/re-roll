- id: srd52:feature/innate-sorcery
  name: Innate Sorcery
  text: |-
    An event in your past left an indelible mark on you, infusing you with simmering magic. As a Bonus Action, you can unleash that magic for 1 minute, during which you gain the following benefits:

    • The spell save DC of your Sorcerer spells increases by 1. • You have Advantage on the attack rolls of Sorcerer spells you cast.

    You can use this feature twice, and you regain all expended uses of it when you finish a Long Rest.
  automation: full
  resources:
    - id: innate-sorcery
      max:
        base: 2
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: innate-sorcery
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: advantage
              on: attacks
              spellAttacks: true
            duration:
              minutes: 1
          - kind: modifier
            modifier:
              kind: bonus
              to: spellDc
              amount:
                bonus:
                  base: 1
            duration:
              minutes: 1
- id: srd52:feature/font-of-magic
  name: Font of Magic
  text: |-
    You can tap into the wellspring of magic within yourself. This wellspring is represented by Sorcery Points, which allow you to create a variety of magical effects. You have 2 Sorcery Points, and you gain more as you reach higher levels, as shown in the Sorcery Points column of the Sorcerer Features table. You can’t have more Sorcery Points than the number shown in the table for your level. You regain all expended Sorcery Points when you finish a Long Rest. You can use your Sorcery Points to fuel the options below, along with other features, such as Metamagic, that use those points. Converting Spell Slots to Sorcery Points. You can expend a spell slot to gain a number of Sorcery Points equal to the slot’s level (no action required). Creating Spell Slots. As a Bonus Action, you can transform unexpended Sorcery Points into one spell slot. The Creating Spell Slots table shows the cost of creating a spell slot of a given level, and it lists the minimum Sorcerer level you must be to create a slot. You can create a spell slot no higher than level 5. Any spell slot you create with this feature vanishes when you finish a Long Rest.

    Creating Spell Slots Spell Slot Level
  automation: full
  resources:
    - id: sorcery-points
      max:
        add:
          - kind: scaling
            key: sorceryPoints
      recharge:
        - on: longRest
          amount: all
- id: srd52:feature/metamagic
  name: Metamagic
  text: |-
    Because your magic flows from within, you can alter your spells to suit your needs; you gain two Metamagic options of your choice from “Meta­magic Options” later in this class’s description. You use the chosen options to temporarily modify spells you cast. To use an option, you must spend the number of Sorcery Points that it costs. You can use only one Metamagic option on a spell when you cast it unless otherwise noted in one of those options.

    Whenever you gain a Sorcerer level, you can replace one of your Metamagic options with one you don’t know. You gain two more options at Sorcerer level 10 and two more at Sorcerer level 17.
  automation: full
- id: srd52:feature/sorcerer-subclass
  name: Sorcerer Subclass
  text: You gain a Sorcerer subclass of your choice. The Draconic Sorcery subclass is detailed after this class’s description. A subclass is a specialization that grants you features at certain Sorcerer levels. For the rest of your career, you gain each of your subclass’s features that are of your Sorcerer level or lower.
  automation: full
- id: srd52:feature/sorcerous-restoration
  name: Sorcerous Restoration
  text: When you finish a Short Rest, you can regain expended Sorcery Points, but no more than a number equal to half your Sorcerer level (round down). Once you use this feature, you can’t do so again until you finish a Long Rest.
  automation: full
  resources:
    - id: sorcerous-restoration
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
    - id: sorcery-points
      max:
        add:
          - kind: scaling
            key: sorceryPoints
      recharge:
        - on: shortRest
          amount:
            add:
              - kind: classLevel
                class: srd52:class/sorcerer
                half: true
          uses: sorcerous-restoration
- id: srd52:feature/sorcery-incarnate
  name: Sorcery Incarnate
  text: If you have no uses of Innate Sorcery left, you can use it if you spend 2 Sorcery Points when you take the Bonus Action to activate it. In addition, while your Innate Sorcery feature is active, you can use up to two of your Metamagic options on each spell you cast.
  automation: full
  passives:
    - kind: doubleMetamagic
      while:
        - srd52:feature/innate-sorcery
        - srd52:feature/sorcery-incarnate
  activations:
    - cost:
        - bonusAction
        - resource: sorcery-points
          count: 2
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: advantage
              on: attacks
            duration:
              minutes: 1
- id: srd52:feature/arcane-apotheosis
  name: Arcane Apotheosis
  text: While your Innate Sorcery feature is active, you can use one Metamagic option on each of your turns without spending Sorcery Points on it.
  automation: full
  passives:
    - kind: freeMetamagic
      while:
        - srd52:feature/innate-sorcery
- id: srd52:feature/draconic-resilience
  name: Draconic Resilience
  text: The magic in your body manifests physical traits of your draconic gift. Your Hit Point maximum increases by 3, and it increases by 1 whenever you gain another Sorcerer level. Parts of you are also covered by dragon-like scales. While you aren’t wearing armor, your base Armor Class equals 10 plus your Dexterity and Charisma modifiers.
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: acFormula
        formula:
          base: 10
          add:
            - kind: abilityMod
              ability: dex
            - kind: abilityMod
              ability: cha
    - kind: modifier
      modifier:
        kind: bonus
        to: maxHp
        amount:
          bonus:
            add:
              - kind: classLevel
                class: srd52:class/sorcerer
- id: srd52:feature/draconic-spells
  name: Draconic Spells
  text: |-
    When you reach a Sorcerer level specified in the Draconic Spells table, you thereafter always have the listed spells prepared.

    Draconic Spells Sorcerer Level

    Alter Self, Chromatic Orb, Command, Dragon’s Breath
  automation: full
  spells:
    "3":
      - srd52:spell/alter-self
      - srd52:spell/chromatic-orb
      - srd52:spell/command
      - srd52:spell/dragon-s-breath
    "5":
      - srd52:spell/fear
      - srd52:spell/fly
    "7":
      - srd52:spell/arcane-eye
      - srd52:spell/charm-monster
    "9":
      - srd52:spell/legend-lore
      - srd52:spell/summon-dragon
- id: srd52:feature/elemental-affinity
  name: Elemental Affinity
  text: "Your draconic magic has an affinity with a damage type associated with dragons. Choose one of those types: Acid, Cold, Fire, Lightning, or Poison. You have Resistance to that damage type, and when you cast a spell that deals damage of that type, you can add your Charisma modifier to one damage roll of that spell."
  automation: full
  variants:
    - id: acid
      name: Acid
      passives:
        - kind: modifier
          modifier:
            kind: resistance
            damage: acid
        - kind: spellDamage
          bonus:
            add:
              - kind: abilityMod
                ability: cha
          types:
