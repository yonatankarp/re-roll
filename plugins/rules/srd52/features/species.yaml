    - kind: seesInDarkness
      feet: 60
- id: srd52:feature/gnome-forest-gnome-lineage
  name: Forest Gnome
  text: You know the Minor Illusion cantrip. You also always have the Speak with Animals spell prepared. You can cast it without a spell slot a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest. You can also use any spell slots you have to cast the spell.
  automation: full
  spells:
    "1":
      - srd52:spell/minor-illusion
      - srd52:spell/speak-with-animals
  resources:
    - id: forest-gnome
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  freeCast:
    resource: forest-gnome
- id: srd52:feature/gnome-gnomish-cunning
  name: Gnomish Cunning
  text: You have Advantage on Intelligence, Wisdom, and Charisma saving throws.
  automation: full
  passives:
    - kind: saveAdvantage
      abilities:
        - int
        - wis
        - cha
- id: srd52:feature/gnome-gnomish-lineage
  name: Gnomish Lineage
  text: "You are part of a lineage that grants you supernatural abilities. Choose one of the following options; whichever one you choose, Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage):"
  automation: full
- id: srd52:feature/gnome-rock-gnome-lineage
  name: Rock Gnome
  text: You know the Mending and Prestidigitation cantrips. In addition, you can spend 10 minutes casting Prestidigitation to create a Tiny clockwork device (AC 5, 1 HP), such as a toy, fire starter, or music box. When you create the device, you determine its function by choosing one effect from Prestidigitation; the device produces that Darkness er you finish h a different Pass without Trace effect whenever you or another creature takes a Bonus Action to activate it with a touch. If the chosen effect has options within it, you choose one of those options for the device when you create it. For example, if you choose the spell’s ignite-extinguish effect, you determine whether the device ignites or extinguishes fire; the device doesn’t do both. You can have three such devices in existence at a time, and each falls apart 8 hours after its creation or when you dismantle it with a touch as a Utilize action.
  automation: full
  spells:
    "1":
      - srd52:spell/mending
      - srd52:spell/prestidigitation
- id: srd52:feature/goliath-cloud-giant-ancestry
  name: Cloud’s Jaunt
  text: Cloud’s Jaunt (Cloud Giant). As a Bonus Action, you magically teleport up to 30 feet to an unoccupied space you can see.
  automation: full
  resources:
    - id: giant-ancestry
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: giant-ancestry
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: teleport
            feet: 30
- id: srd52:feature/goliath-fire-giant-ancestry
  name: Fire’s Burn
  text: Fire’s Burn (Fire Giant). When you hit a target with an attack roll and deal damage to it, you can also deal 1d10 Fire damage to that target.
  automation: full
  resources:
    - id: giant-ancestry
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - resource: giant-ancestry
      trigger:
        afterHit: attack
      targeting:
        creatures: 1
        range: 120
        side: enemy
      resolution:
        kind: automatic
        damage:
          - amount:
              dice: 1d10
            type: fire
        effects: []
- id: srd52:feature/goliath-frost-giant-ancestry
  name: Frost’s Chill
  text: Frost’s Chill (Frost Giant). When you hit a target with an attack roll and deal damage to it, you can also deal 1d6 Cold damage to that target and reduce its Speed by 10 feet until the start of your next turn.
  automation: full
  resources:
    - id: giant-ancestry
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  activations:
