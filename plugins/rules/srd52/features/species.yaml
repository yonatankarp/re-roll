      trigger:
        afterHit: attack
      targeting:
        creatures: 1
        range: 120
        side: enemy
      resolution:
        kind: automatic
        damage:
          - amount:
              dice: 1d6
            type: cold
        effects:
          - kind: modifier
            modifier:
              kind: bonus
              to: speed
              amount:
                bonus:
                  base: 10
              subtract: true
            duration:
              until: yourNextTurnStart
- id: srd52:feature/goliath-giant-ancestry
  name: Giant Ancestry
  text: "You are descended from Giants. Choose one of the following benefits—a supernatural boon from your ancestry; you can use the chosen benefit a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest:"
  automation: full
- id: srd52:feature/goliath-hill-giant-ancestry
  name: Hill’s Tumble
  text: Hill’s Tumble (Hill Giant). When you hit a Large or smaller creature with an attack roll and deal damage to it, you can give that target the Prone condition.
  automation: full
  resources:
    - id: giant-ancestry
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - resource: giant-ancestry
      trigger:
        afterHit: attack
      targeting:
        creatures: 1
        range: 120
        side: enemy
        maxSize: large
      resolution:
        kind: automatic
        damage: []
        effects:
          - kind: applyCondition
            condition: prone
            duration:
              minutes: 1
- id: srd52:feature/goliath-large-form
  name: Large Form
  text: Starting at character level 5, you can change your size to Large as a Bonus Action if you’re in a big enough space. This transformation lasts for 10 minutes or until you end it (no action required). For that duration, you have Advantage on Strength checks, and your Speed increases by 10 feet. Once you use this trait, you can’t use it again until you finish a Long Rest.
  automation: full
  fromLevel: 5
  resources:
    - id: large-form
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: large-form
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: modifier
            modifier:
              kind: advantage
              on: checks
              ability: str
            duration:
              minutes: 10
          - kind: modifier
            modifier:
              kind: bonus
              to: speed
              amount:
                bonus:
                  base: 10
            duration:
              minutes: 10
          - kind: modifier
            modifier:
              kind: size
              set: large
            duration:
              minutes: 10
- id: srd52:feature/goliath-powerful-build
  name: Powerful Build
  text: You have Advantage on any ability check you make to end the Grappled condition. You also count as one size larger when determining your carrying capacity.
  automation: full
  passives:
    - kind: powerfulBuild
- id: srd52:feature/goliath-stone-giant-ancestry
  name: Stone’s Endurance
  text: Stone’s Endurance (Stone Giant). When you take damage, you can take a Reaction to roll 1d12. Add your Constitution modifier to the number rolled and reduce the damage by that total.
  automation: full
  resources:
    - id: giant-ancestry
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - reaction
        - resource: giant-ancestry
      trigger:
        damaged: true
        before: true
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: reduceDamage
            amount:
              dice: 1d12
              bonus:
                add:
                  - kind: abilityMod
                    ability: con
- id: srd52:feature/goliath-storm-giant-ancestry
  name: Storm’s Thunder
  text: Storm’s Thunder (Storm Giant). When you take damage from a creature within 60 feet of you, you can take a Reaction to deal 1d8 Thunder damage to that creature.
  automation: full
  resources:
    - id: giant-ancestry
      max:
        add:
          - kind: proficiency
      recharge:
        - on: longRest
          amount: all
  activations:
    - cost:
        - reaction
        - resource: giant-ancestry
      trigger:
        damaged: true
      targeting:
        creatures: 1
        range: 60
        side: enemy
      resolution:
        kind: automatic
        damage:
          - amount:
              dice: 1d8
            type: thunder
        effects: []
- id: srd52:feature/halfling-brave
  name: Brave
  text: You have Advantage on saving throws you make to avoid or end the Frightened condition.
  automation: full
  passives:
    - kind: saveAdvantage
      conditions:
        - frightened
- id: srd52:feature/halfling-halfling-nimbleness
  name: Halfling Nimbleness
  text: You can move through the space of any creature that is a size larger than you, but you can’t stop in the same space.
  automation: full
  passives:
    - kind: moveThrough
      creatures: larger
- id: srd52:feature/halfling-luck
  name: Luck
  text: When you roll a 1 on the d20 of a D20 Test, you can reroll the die, and you must use the new roll.
  automation: full
  passives:
    - kind: rerollOnes
- id: srd52:feature/halfling-naturally-stealthy
  name: Naturally Stealthy
  text: You can take the Hide action even when you are obscured only by a creature that is at least one size larger than you.
  automation: full
  passives:
    - kind: hideBehindLarger
- id: srd52:feature/orc-adrenaline-rush
  name: Adrenaline Rush
  text: You can take the Dash action as a Bonus Action. When you do so, you gain a number of Temporary Hit Points equal to your Proficiency Bonus. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Short or Long Rest.
  automation: full
  resources:
    - id: adrenaline-rush
      max:
        add:
          - kind: proficiency
      recharge:
        - on: shortRest
          amount: all
        - on: longRest
          amount: all
  activations:
    - cost:
        - bonusAction
        - resource: adrenaline-rush
      targeting:
        self: true
      resolution:
        kind: automatic
        effects:
          - kind: dash
          - kind: tempHp
            amount:
              bonus:
                add:
                  - kind: proficiency
- id: srd52:feature/orc-darkvision
  name: Darkvision
  text: You have Darkvision with a range of 120 feet.
  automation: full
  passives:
    - kind: seesInDarkness
      feet: 120
- id: srd52:feature/orc-relentless-endurance
  name: Relentless Endurance
  text: When you are reduced to 0 Hit Points but not killed outright, you can drop to 1 Hit Point instead. Once you use this trait, you can’t do so again until you finish a Long Rest.
  automation: full
  passives:
    - kind: dropToOne
      resource: relentless-endurance
  resources:
    - id: relentless-endurance
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
- id: srd52:feature/tiefling-abyssal-legacy
  name: Abyssal
  text: You have Resistance to Poison damage. You also know the Poison Spray cantrip. At character level 3 you learn Ray of Sickness, and at level 5 Hold Person.
  automation: full
  spells:
    "1":
      - srd52:spell/poison-spray
    "3":
      - srd52:spell/ray-of-sickness
    "5":
      - srd52:spell/hold-person
  freeCast: true
  passives:
    - kind: modifier
      modifier:
        kind: resistance
        damage: poison
- id: srd52:feature/tiefling-chthonic-legacy
  name: Chthonic
  text: You have Resistance to Necrotic damage. You also know the Chill Touch cantrip. At character level 3 you learn False Life, and at level 5 Ray of Enfeeblement.
  automation: full
  spells:
    "1":
      - srd52:spell/chill-touch
    "3":
      - srd52:spell/false-life
    "5":
      - srd52:spell/ray-of-enfeeblement
  freeCast: true
  passives:
    - kind: modifier
      modifier:
        kind: resistance
        damage: necrotic
- id: srd52:feature/tiefling-darkvision
  name: Darkvision
  text: You have Darkvision with a range of 60 feet.
  automation: full
  passives:
    - kind: seesInDarkness
      feet: 60
- id: srd52:feature/tiefling-fiendish-legacy
  name: Fiendish Legacy
  text: You are the recipient of a legacy that grants you supernatural abilities. Choose a legacy from the Fiendish Legacies table. You gain the level 1 benefit of the chosen legacy. When you reach character levels 3 and 5, you learn a higher-level spell, as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level. Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the legacy).
  automation: full
- id: srd52:feature/tiefling-infernal-legacy
  name: Infernal
  text: You have Resistance to Fire damage. You also know the Fire Bolt cantrip. At character level 3 you learn Hellish Rebuke, and at level 5 Darkness.
  automation: full
  spells:
    "1":
      - srd52:spell/fire-bolt
    "3":
      - srd52:spell/hellish-rebuke
    "5":
      - srd52:spell/darkness
  freeCast: true
  passives:
    - kind: modifier
      modifier:
        kind: resistance
        damage: fire
- id: srd52:feature/tiefling-otherworldly-presence
  name: Otherworldly Presence
  text: You know the Thaumaturgy cantrip. When you cast it with this trait, the spell uses the same spellcasting ability you use for your Fiendish Legacy trait.
  automation: full
  spells:
    "1":
      - srd52:spell/thaumaturgy
