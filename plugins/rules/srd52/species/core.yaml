- id: "srd52:species/human"
  name: Human
  text: "Found throughout the multiverse, Humans are as varied as they are adaptable."
  creatureType: Humanoid
  size: medium
  speed: 30
  traits: ["srd52:feature/human-traits"]
  choices:
    - {
        kind: skills,
        id: skillful,
        count: 1,
        from:
          [
            acrobatics,
            animalHandling,
            arcana,
            athletics,
            deception,
            history,
            insight,
            intimidation,
            investigation,
            medicine,
            nature,
            perception,
            performance,
            persuasion,
            religion,
            sleightOfHand,
            stealth,
            survival,
          ],
      }
    - { kind: feat, id: versatile, category: origin }
- id: "srd52:species/dwarf"
  name: Dwarf
  text: "Raised from the earth in ages past, Dwarves are as tough as the stone they shape."
  creatureType: Humanoid
  size: medium
  speed: 30
  traits: ["srd52:feature/dwarf-traits"]
- id: "srd52:species/elf"
  name: Elf
  text: "Long-lived and touched by the Feywild, Elves rest in a trance instead of sleep."
  creatureType: Humanoid
  size: medium
  speed: 30
  traits: ["srd52:feature/elf-traits"]
  choices:
    - kind: option
      id: elven-lineage
      count: 1
      from:
        [
          "srd52:feature/elf-drow-lineage",
          "srd52:feature/elf-high-elf-lineage",
          "srd52:feature/elf-wood-elf-lineage",
        ]
    - {
        kind: skills,
        id: keen-senses,
        count: 1,
        from: [insight, perception, survival],
      }
    - { kind: spellAbility, id: spellcasting, from: [int, wis, cha] }
