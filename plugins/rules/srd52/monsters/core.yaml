- id: "srd52:monster/ghoul"
  name: Ghoul
  size: medium
  creatureType: undead
  ac: 12
  hp: 22
  speed: 30
  abilities: { str: 13, dex: 15, con: 10, int: 7, wis: 10, cha: 6 }
  proficiency: 2
  initiative: 2
  multiattack: 2
  passives:
    - { kind: modifier, modifier: { kind: immunity, damage: poison } }
    - { kind: conditionImmunity, condition: charmed }
    - { kind: conditionImmunity, condition: poisoned }
  actions:
    - name: Bite
      activation:
        cost: [action]
        targeting: { creatures: 1, range: 5, side: enemy }
        resolution:
          kind: attack
          attack: { type: weapon, flatBonus: 4 }
          damage:
            - { amount: { dice: 1d6, bonus: { base: 2 } }, type: piercing }
            - { amount: { dice: 1d6 }, type: necrotic }
    - name: Claw
      activation:
        cost: [action]
        targeting: { creatures: 1, range: 5, side: enemy }
        resolution:
          kind: attack
          attack: { type: weapon, flatBonus: 4 }
          damage:
            [{ amount: { dice: 1d4, bonus: { base: 2 } }, type: slashing }]
          onHitSave:
            ability: con
            dc: { base: 10 }
            exempt: [undead, elf]
            onFail:
              - kind: applyCondition
                condition: paralyzed
                duration: { until: itsNextTurnEnd }
