- id: "srd52:monster/goblin-warrior"
  name: Goblin Warrior
  ac: 15
  hp: 10
  speed: 30
  abilities: { str: 8, dex: 15, con: 10, int: 10, wis: 8, cha: 8 }
  proficiency: 2
  initiative: 2
  passives:
    - { kind: extraDamage, dice: 1d4, when: advantage }
  actions:
    - name: Scimitar
      activation:
        cost: [action]
        targeting: { creatures: 1, range: 5, side: enemy }
        resolution:
          kind: attack
          attack: { type: weapon, flatBonus: 4 }
          damage:
            [{ amount: { dice: 1d6, bonus: { base: 2 } }, type: slashing }]
    - name: Shortbow
      activation:
        cost: [action]
        targeting: { creatures: 1, range: 80, side: enemy }
        resolution:
          kind: attack
          attack: { type: weapon, flatBonus: 4 }
          damage:
            [{ amount: { dice: 1d6, bonus: { base: 2 } }, type: piercing }]
    # Nimble Escape, as Hide. Disengage does nothing without a map.
    # shortcut: the Stealth check is a plain Dexterity roll, and hiding lasts until this goblin's next turn rather than its next attack, until skills can be rolled here.
    - name: Nimble Escape
      activation:
        cost: [bonusAction]
        targeting: { self: true }
        resolution:
          kind: save
          ability: dex
          dc: { base: 15 }
          onSuccess:
            - kind: applyCondition
              condition: invisible
              duration: { until: yourNextTurnStart }
