# The creatures Animate Dead, Create Undead, Awaken and Finger of Death make (#126).
- id: "srd52:monster/skeleton"
  name: Skeleton
  size: medium
  creatureType: undead
  ac: 14
  hp: 13
  speed: 30
  abilities: { str: 10, dex: 16, con: 15, int: 6, wis: 8, cha: 5 }
  proficiency: 2
  initiative: 3
  passives:
    - { kind: modifier, modifier: { kind: vulnerability, damage: bludgeoning } }
    - { kind: modifier, modifier: { kind: immunity, damage: poison } }
    - { kind: conditionImmunity, condition: poisoned }
  actions:
    - name: Shortsword
      activation:
        cost: [action]
        targeting: { creatures: 1, range: 5, side: enemy }
        resolution:
          kind: attack
          attack: { type: weapon, flatBonus: 5 }
          damage:
            [{ amount: { dice: 1d6, bonus: { base: 3 } }, type: piercing }]
    - name: Shortbow
      activation:
        cost: [action]
        targeting: { creatures: 1, range: 80, side: enemy }
        resolution:
          kind: attack
          attack: { type: weapon, flatBonus: 5 }
          damage:
            [{ amount: { dice: 1d6, bonus: { base: 3 } }, type: piercing }]
