- id: srd52:feat/skilled
  name: Skilled
  category: origin
  text: You gain proficiency in any combination of three skills or tools of your choice. Repeatable.
  grants:
    - srd52:feature/skilled
  choices:
    - kind: skills
      id: skilled
      count: 3
      from:
        - acrobatics
        - animalHandling
        - arcana
        - athletics
        - deception
        - history
        - insight
        - intimidation
        - investigation
        - medicine
        - nature
        - perception
        - performance
        - persuasion
        - religion
        - sleightOfHand
        - stealth
        - survival
- id: srd52:feat/magic-initiate-druid
  name: Magic Initiate (Druid)
  category: origin
  text: Learn two Druid cantrips and one level 1 Druid spell, cast once per Long Rest without a slot.
  grants:
    - srd52:feature/magic-initiate
  choices:
    - kind: spells
      id: cantrips
      count: 2
      maxLevel: 0
      list: srd52:class/druid
      late: true
    - kind: spells
      id: spell
      count: 1
      maxLevel: 1
      list: srd52:class/druid
      freeCast: true
      late: true
- id: srd52:feat/boon-of-combat-prowess
  name: Boon of Combat Prowess
  category: epicBoon
  text: Peerless Aim. When you miss with an attack roll, you can hit instead.
  grants:
    - srd52:feature/boon-of-combat-prowess
  abilityIncrease:
    - str
    - dex
    - con
    - int
    - wis
    - cha
- id: srd52:feat/boon-of-dimensional-travel
  name: Boon of Dimensional Travel
  category: epicBoon
  text: Blink Steps. Immediately after you take the Attack action or the Magic action, you can teleport up to 30 feet to an unoccupied space you can see.
  grants:
    - srd52:feature/boon-of-dimensional-travel
  abilityIncrease:
    - str
    - dex
    - con
    - int
    - wis
    - cha
- id: srd52:feat/boon-of-fate
  name: Boon of Fate
  category: epicBoon
  text: Improve Fate. When you or another creature within 60 feet of you succeeds on or fails a D20 Test, you can roll 2d4 and apply the total rolled as a bonus or penalty to the d20 roll.
  grants:
    - srd52:feature/boon-of-fate
  abilityIncrease:
    - str
    - dex
    - con
    - int
    - wis
    - cha
- id: srd52:feat/boon-of-irresistible-offense
  name: Boon of Irresistible Offense
  category: epicBoon
  text: Overcome Defenses. The Bludgeoning, Piercing, and Slashing damage you deal always ignores Resistance.
  grants:
    - srd52:feature/boon-of-irresistible-offense
  abilityIncrease:
    - str
    - dex
- id: srd52:feat/boon-of-spell-recall
  name: Boon of Spell Recall
  category: epicBoon
  text: Free Casting. Whenever you cast a spell with a level 1–4 spell slot, roll 1d4.
  grants:
    - srd52:feature/boon-of-spell-recall
  abilityIncrease:
    - int
    - wis
    - cha
  prerequisite:
    spellcasting: true
- id: srd52:feat/boon-of-the-night-spirit
  name: Boon of the Night Spirit
  category: epicBoon
  text: Merge with Shadows. While within Dim Light or Darkness, you can give yourself the Invisible condition as a Bonus Action.
  grants:
    - srd52:feature/boon-of-the-night-spirit
  abilityIncrease:
    - str
    - dex
    - con
    - int
    - wis
    - cha
- id: srd52:feat/boon-of-truesight
  name: Boon of Truesight
  category: epicBoon
  text: Truesight. You have Truesight with a range of 60 feet.
  grants:
    - srd52:feature/boon-of-truesight
  abilityIncrease:
    - str
    - dex
    - con
    - int
    - wis
    - cha
