- id: "srd52:item/potion-of-healing"
  name: Potion of Healing
  costCp: 5000
  weightLb: 0.5
  type: magicItem
  category: potion
  rarity: common
  attunement: false
  text: A vial of red liquid. Drinking it takes a Bonus Action and heals 2d4 + 2 Hit Points.
  automation: full
  healing: { dice: 2d4, bonus: { base: 2 } }
- id: "srd52:item/ring-of-protection"
  name: Ring of Protection
  type: magicItem
  category: ring
  rarity: rare
  attunement: true
  text: While attuned and wearing it, you have +1 to Armor Class and saving throws.
  automation: partial
  bonuses:
    - { to: ac, amount: 1 }
    - { to: savingThrows, amount: 1 }
- id: "srd52:item/spell-scroll-magic-missile"
