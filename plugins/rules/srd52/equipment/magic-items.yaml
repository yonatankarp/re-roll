              duration:
                until: longRest
  text: While holding this rod, you can take a Magic action to activate it. The rod then instantly transports you and up to 199 other willing creatures you can see to a demiplane. You choose the form the demiplane takes. It could be a tranquil garden, a cheery tavern, an immense palace, a tropical island, a fantastic carnival, or whatever else you can imagine. Regardless of its nature, the demiplane contains enough water and food to sustain its visitors, and the demiplane’s environment can’t harm its occupants. Everything else that can be interacted with there can exist only there. For example, a flower picked from a garden there disappears if it is taken outside the demiplane. For each hour spent in the demiplane, a visitor regains Hit Points as if it had spent 1 Hit Point Die. Also, creatures don’t age while there, although time passes normally. Visitors can remain there for up to 200 days divided by the number of creatures present (round down). When the time runs out or you take a Magic action to end the effect, all visitors reappear in the location they occupied when you activated the rod or an unoccupied space nearest that location. Once used, this property can’t be used again until 10 days have passed.
- id: srd52:item/rope-of-climbing
  name: Rope of Climbing
  type: magicItem
  category: wondrousItem
  rarity: uncommon
  attunement: false
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: sceneAid
        about:
          - climb
        aid: success
  text: |-
    This 60-foot length of rope can hold up to 3,000 pounds. While holding one end of the rope, you can take a Magic action to command the other end of the rope to animate and move toward a destination you choose, up to the rope’s length away from you. That end moves 10 feet on your turn when you first command it and 10 feet at the start of each of your subsequent turns until reaching its destination or until you tell it to stop. You can also tell the rope to fasten itself securely to an object or to unfasten itself, to knot or unknot itself, or to coil itself for carrying. If you tell the rope to knot, large knots appear at 1-foot intervals along the rope. While knotted, the rope shortens to a 50-foot length and grants Advantage on ability checks made to climb using the rope. The rope has AC 20, HP 20, and Immunity to Poison and Psychic damage. It regains 1 Hit Point every

    5 minutes as long as it has at least 1 Hit Point. If the rope drops to 0 Hit Points, it is destroyed.
- id: srd52:item/rope-of-entanglement
  name: Rope of Entanglement
  type: magicItem
  category: wondrousItem
  rarity: rare
  attunement: false
  automation: full
  activations:
    - name: Entangle
      activation:
        cost:
          - action
        targeting:
          creatures: 1
          range: 20
          side: enemy
        resolution:
          kind: save
          ability: dex
          dc:
            base: 15
          onFail:
            - kind: applyCondition
              condition: restrained
              duration:
                until: rest
              endSave:
                ability: dex
                dc:
                  base: 15
              actionSave: true
  text: This rope is 30 feet long. While holding one end of the rope, you can take a Magic action to command the other end to dart forward and entangle one creature you can see within 20 feet of yourself. The target must succeed on a DC 15 Dexterity saving throw or have the Restrained condition. You can release the target by letting go of your end of the rope (causing the rope to coil up in the target’s space) or by using a Bonus Action to repeat the command (causing the rope to coil up in your hand). A target Restrained by the rope can take an action to make its choice of a DC 15 Strength (Athletics) or Dexterity (Acrobatics) check. On a successful check, the target is no longer Restrained by the rope. If you’re still holding onto the rope when a target escapes from it, you can take a Reaction to command the rope to coil up in your hand; otherwise, the rope coils up in the target’s space. The rope has AC 20, HP 20, and Immunity to Poison and Psychic damage. It regains 1 Hit Point every 5 minutes as long as it has at least 1 Hit Point. If the rope drops to 0 Hit Points, it is destroyed.
- id: srd52:item/scarab-of-protection
  name: Scarab of Protection
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: true
  automation: full
  resources:
    - id: scarab-of-protection
      max:
        base: 12
      recharge: []
  passives:
    - kind: magicResistance
    - kind: saveRescue
      from:
        schools:
          - necromancy
        creatureTypes:
          - undead
      reaction: true
      resource: scarab-of-protection
      item: srd52:item/scarab-of-protection
  bonuses:
    - to: ac
      amount: 1
  text: This beetle-shaped medallion provides three benefits while it is on your person. Defense. You gain a +1 bonus to Armor Class. Preservation. The scarab has 12 charges. If you fail a saving throw against a Necromancy spell or a harmful effect originating from an Undead, you can take a Reaction to expend 1 charge and turn the failed save into a successful one. The scarab crumbles into powder and is destroyed when its last charge is expended. Spell Resistance. You have Advantage on saving throws against spells.
- id: srd52:item/scimitar-of-speed
  name: Scimitar of Speed
  type: magicItem
