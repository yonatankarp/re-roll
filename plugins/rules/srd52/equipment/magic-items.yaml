- id: srd52:item/amulet-of-the-planes
  name: Amulet of the Planes
  type: magicItem
  category: wondrousItem
  rarity: veryRare
  attunement: true
  automation: full
  casts:
    - spell: plane-shift
      charges: 0
  text: |-
    While wearing this amulet, you can take a Magic action to name a location that you are familiar with on another plane of existence. Then make a DC 15 Intelligence (Arcana) check. On a successful check, you cast Plane Shift. On a failed check, you and each creature and object within 15 feet of you travel to a random destination determined by rolling 1d100 and consulting the following table. 1d100

    01–60 Random location on the plane you named

    61–70 Random location on an Inner Plane determined by rolling 1d6: on a 1, the Plane of Air; on a 2, the Plane of Earth; on a 3, the Plane of Fire; on a 4, the Plane of Water; on a 5, the Feywild; on a 6, the Shadowfell 71–80 Random location on an Outer Plane determined by rolling 1d8: on a 1, Arborea; on a 2, Arcadia; on a 3, the Beastlands; on a 4, Bytopia; on a 5, Elysium; on a 6, Mechanus; on a 7, Mount Celestia; on an 8, Ysgard 81–90 Random location on an Outer Plane determined by rolling 1d8: on a 1, the Abyss; on a 2, Acheron; on a 3, Carceri; on a 4, Gehenna; on a 5, Hades; on a 6, Limbo; on a 7, the Nine Hells; on an 8, Pandemonium 91–00 Random location on the Astral Plane
- id: srd52:item/animated-shield
  name: Animated Shield
  type: magicItem
  category: armor
  rarity: veryRare
  attunement: true
  automation: full
  text: While holding this Shield, you can take a Bonus Action to cause it to animate. The Shield leaps into the air and hovers in your space to protect you as if you were wielding it, leaving your hands free. The Shield remains animate for 1 minute, until you take a Bonus Action to end this effect, or until you die or have the Incapacitated condition, at which point the Shield falls to the ground or into your hand if you have one free.
- id: srd52:item/apparatus-of-the-crab
  name: Apparatus of the Crab
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: false
  automation: full
  activations:
    - name: Pilot the Apparatus
      activation:
        cost:
          - action
        targeting:
          self: true
        resolution:
          kind: automatic
          effects:
            - kind: polymorph
              duration:
                minutes: 600
              forms:
                ids:
                  - srd52:monster/apparatus-of-the-crab
              keep:
                - mind
                - features
  passives:
    - kind: modifier
      modifier:
        kind: sceneAid
        about:
          - water
        aid: success
  text: |-
    This item first appears to be a sealed iron barrel weighing 500 pounds. The barrel has a hidden catch, which can be found with a successful DC 20 Intelligence (Investigation) check. Releasing the catch unlocks a hatch at one end of the barrel, allowing two Medium or smaller creatures to crawl inside. Ten levers are set in a row at the far end, each in a neutral position, able to move up or down. When certain levers are used, the apparatus transforms to resemble a giant lobster. The Apparatus of the Crab is a Large object with the following statistics: AC 20; HP 200; Speed 30 ft., Swim 30 ft. (or 0 ft. for both if the legs aren’t extended); Immunity to Poison and Psychic damage. To be used as a vehicle, the apparatus requires one pilot. While the apparatus’s hatch is closed, the compartment is airtight and watertight. The compartment holds enough air for 10 hours of breathing, divided by the number of breathing creatures inside. The apparatus floats on water. It can also go underwater to a depth of 900 feet. Below that, the vehicle takes 2d6 Bludgeoning damage each minute from pressure. A creature in the compartment can take a Utilize action to move as many as two of the apparatus’s levers up or down. After each use, a lever goes back to its neutral position. Each lever, from left to right, functions as shown in the Apparatus of the Crab Levers table.

    Apparatus of the Crab Levers Lever Up

    Legs extend, allowing the apparatus to walk and sw

    Forward window shutter opens.

    Side window shutters open (two per side).

    Two claws extend from the front side of the apparatus.

    Each extended claw makes the following melee atta +8 to hit, reach 5 ft. Hit: 7 (2d6) Bludgeoning dama

    The apparatus walks or swims forward provided its legs are extended.

    The apparatus turns 90 degrees counterclockwise provided its legs are extended.

    Eyelike fixtures emit Bright Light in a 30-foot radiu and Dim Light for an additional 30 feet.

    The apparatus sinks up to 20 feet if it’s in liquid.

    The rear hatch unseals and opens.

    Armor (Any Light, Medium, or Heavy), Rare (+1), Very Rare (+2), or Legendary (+3) You have a bonus to Armor Class while wearing this armor. The bonus is determined by its rarity.
