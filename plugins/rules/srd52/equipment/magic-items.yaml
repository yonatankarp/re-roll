  automation: full
  passives:
    - kind: missileResistance
  curse:
    passives:
      - kind: missileMagnet
        within: 10
  text: While holding this Shield, you have Resistance to damage from attacks made with Ranged weapons. Curse. This Shield is cursed. Attuning to it curses you until you are targeted by a Remove Curse spell or similar magic. Removing the Shield fails to end the curse on you. Whenever an attack with a Ranged weapon targets a creature within 10 feet of you, the curse causes you to become the target instead.
- id: srd52:item/slippers-of-spider-climbing
  name: Slippers of Spider Climbing
  type: magicItem
  category: wondrousItem
  rarity: uncommon
  attunement: true
  automation: full
  passives:
    - kind: modifier
      modifier:
        kind: movementMode
        mode: climb
        ceiling: true
  text: While you wear these light shoes, you can move up, down, and across vertical surfaces and along ceilings, while leaving your hands free. You have a Climb Speed equal to your Speed. However, the slippers don’t allow you to move this way on a slippery surface, such as one covered by ice or oil.
- id: srd52:item/sovereign-glue
  name: Sovereign Glue
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: false
  automation: full
  text: This viscous, milky-white substance can form a permanent adhesive bond between any two objects. It must be stored in a jar or flask that has been coated inside with Oil of Slipperiness. When found, a container contains 1d6 + 1 ounces. One ounce of the glue can cover a 1-foot square surface. Applying an ounce of Sovereign Glue takes a Utilize action, and the applied glue takes 1 minute to set. Once it has done so, the bond it creates can be broken only by the application of Universal Solvent or Oil of Etherealness, or with a Wish spell.
- id: srd52:item/spellguard-shield
  name: Spellguard Shield
  type: magicItem
  category: armor
  rarity: veryRare
  attunement: true
  automation: full
  passives:
    - kind: magicResistance
    - kind: modifier
      modifier:
        kind: disadvantage
        on: attacksAgainst
        spells: true
  text: While holding this Shield, you have Advantage on saving throws against spells and other magical effects, and spell attack rolls have Disadvantage against you.
- id: srd52:item/spell-scroll
  name: Spell Scroll
  type: magicItem
  category: scroll
  rarity: varies
  attunement: false
  automation: full
  boundSpell:
    as: scroll
  text: |-
    A Spell Scroll bears the words of a single spell, written in a mystical cipher. If the spell is on your spell list, you can read the scroll and cast its spell without Material components. Otherwise, the scroll is unintelligible. Casting the spell by reading the scroll requires the spell’s normal casting time. Once the spell is cast, the scroll crumbles to dust. If the casting is interrupted, the scroll isn’t lost. If the spell is on your spell list but of a higher level than you can normally cast, you make an ability check using your spellcasting ability to determine whether you cast the spell. The DC equals 10 plus the spell’s level. On a failed check, the spell disappears from the scroll with no other effect. The level of the spell on the scroll determines the spell’s saving throw DC and attack bonus, as well as the scroll’s rarity, as shown in the following table. Spell Level Rarity

    Copying a Scroll into a Spellbook. A Wizard spell on a Spell Scroll can be copied into a spellbook. When a spell is copied in this way, the copier must succeed on an Intelligence (Arcana) check with a DC equal to 10 plus the spell’s level. On a successful check, the spell is copied. Whether the check succeeds or fails, the Spell Scroll is destroyed.
- id: srd52:item/sphere-of-annihilation
  name: Sphere of Annihilation
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: false
  automation: full
  text: |-
    This 2-foot-diameter black sphere is a hole in the multiverse, hovering in space and stabilized by a magical field surrounding it. The sphere obliterates all matter it passes through and all matter that passes through it. Artifacts are the exception. Unless an Artifact is susceptible to damage from a Sphere of Annihilation, it passes through the sphere unscathed. Anything else that touches the sphere but isn’t wholly engulfed and obliterated by it takes 8d10 Force damage. Controlling the Sphere. A Sphere of Annihilation is stationary until someone takes control of it. If you are within 60 feet of a sphere, you can take a Magic action to make a DC 25 Intelligence (Arcana) check. On a successful check, you control the sphere until the start of your next turn, and if it was under another creature’s control, that creature loses control of the sphere. On a failed check, the sphere moves 10 feet toward you in a straight line. While in control of the sphere, you can take a Bonus Action to cause it to move in one direction of your choice, up to a number of feet equal to 5 times your Intelligence modifier (minimum 5 feet). Any creature whose space the sphere enters must succeed on a DC 19 Dexterity saving throw or be touched by it, taking 8d10 Force damage. A creature reduced to 0 Hit Points by this damage is obliterated, leaving its possessions behind but no other physical remains. Sphere Interactions. If the sphere comes into contact with a planar portal (such as that created by the Gate spell) or an extradimensional space (such as that within a Portable Hole), the GM determines randomly what happens using the following table. 1d100

    01–50 The sphere is destroyed.

    51–85 The sphere moves through the portal or into the extradimensional space. 86–00 A spatial rift sends the sphere and each creature and object within 180 feet of the sphere to a random plane of existence.
- id: srd52:item/staff-of-charming
  name: Staff of Charming
  type: magicItem
  category: staff
  rarity: rare
  attunement: true
  attunementBy: a Bard, Cleric, Druid, Sorcerer, Warlock, or Wizard
  automation: full
  passives:
