      max:
        base: 5
      recharge:
        - on: dawn
          amount: 1
          roll: 1d4
  passives:
    - kind: attackAdvantage
      when: creatureType
      creatureTypes:
        - elemental
    - kind: modifier
      modifier:
        kind: disadvantage
        on: attacksAgainst
        attackers:
          - elemental
  activations:
    - name: Elemental Compulsion
      activation:
        cost:
          - action
        targeting:
          creatures: 1
          range: 60
          side: enemy
          creatureTypes:
            - elemental
        resolution:
          kind: save
          ability: wis
          dc:
            base: 18
          onFail:
            - kind: applyCondition
              condition: charmed
              duration:
                until: yourNextTurnStart
            - kind: modifier
              modifier:
                kind: controlled
              duration:
                until: yourNextTurnStart
  variants:
    - rarity: legendary
      name: Ring of Elemental Command (air)
      passives:
        - kind: modifier
          modifier:
            kind: resistance
            damage: lightning
        - kind: modifier
          modifier:
            kind: movementMode
            mode: fly
            hover: true
      casts:
        - spell: chain-lightning
          charges: 3
          dc: 18
        - spell: feather-fall
          charges: 0
          dc: 18
        - spell: gust-of-wind
          charges: 2
          dc: 18
        - spell: wind-wall
          charges: 1
          dc: 18
    - rarity: legendary
      name: Ring of Elemental Command (earth)
      passives:
        - kind: modifier
          modifier:
            kind: resistance
            damage: acid
        - kind: moveThrough
          walls: true
          costly: true
          terrain: true
      casts:
        - spell: earthquake
          charges: 5
          dc: 18
        - spell: stone-shape
          charges: 2
          dc: 18
        - spell: stoneskin
          charges: 3
          dc: 18
        - spell: wall-of-stone
          charges: 3
          dc: 18
    - rarity: legendary
      name: Ring of Elemental Command (fire)
      passives:
        - kind: modifier
          modifier:
            kind: immunity
            damage: fire
      casts:
        - spell: burning-hands
          charges: 1
          dc: 18
        - spell: fireball
          charges: 2
          dc: 18
        - spell: fire-storm
          charges: 4
          dc: 18
        - spell: wall-of-fire
          charges: 3
          dc: 18
    - rarity: legendary
      name: Ring of Elemental Command (water)
      passives:
        - kind: modifier
          modifier:
            kind: waterBreathing
        - kind: modifier
          modifier:
            kind: movementMode
            mode: swim
            feet: 60
      casts:
        - spell: create-or-destroy-water
          charges: 1
          dc: 18
        - spell: ice-storm
          charges: 2
          dc: 18
        - spell: tsunami
          charges: 5
          dc: 18
        - spell: wall-of-ice
          charges: 3
          dc: 18
        - spell: water-walk
          charges: 2
          dc: 18
  text: |-
    Each Ring of Elemental Command is linked to one of the four Elemental Planes. The GM chooses or randomly determines the linked plane. For example, a Ring of Elemental Command (air) is linked to the Elemental Plane of Air. Every Ring of Elemental Command has the following two properties: Elemental Bane. While wearing the ring, you have Advantage on attack rolls against Elementals and they have Disadvantage on attack rolls against you. Elemental Compulsion. While wearing the ring, you can take a Magic action to try to compel an Elemental you see within 60 feet of yourself. The Elemental makes a DC 18 Wisdom saving throw. On a failed save, the Elemental has the Charmed condition until the start your next turn, and you determine what it does with its move and action on its next turn.

    Elemental Focus. While wearing the ring, you benefit from additional properties corresponding to the ring’s linked Elemental Plane: Air. You know Auran, you have Resistance to Lightning damage, and you have a Fly Speed equal to your Speed and can hover. Earth. You know Terran, and you have Resistance to Acid damage. Terrain composed of rubble, rocks, or dirt isn’t Difficult Terrain for you. In addition, you can move through solid earth or rock as if those areas were Difficult Terrain without disturbing the matter through which you pass. If you end your turn in solid earth or rock, you are shunted out to the nearest unoccupied space you last occupied. Fire. You know Ignan, and you have Immunity to Fire damage. Water. You know Aquan, you gain a Swim Speed of 60 feet, and you can breathe underwater.

    Spellcasting. The ring has 5 charges and regains 1d4 + 1 expended charges daily at dawn. While wearing the ring, you can cast a spell from it. Choose the spell from the list of available spells based on the Elemental Plane the ring is linked to, as shown in the following table. The table indicates how many charges you must expend to cast the spell, which has a save DC of 18. Plane

    Chain Lightning (3 charges), Feather Fall (0 charges), Gust of Wind (2 charges), Wind Wall (1 charge)

    Earthquake (5 charges), Stone Shape (2 charges), Stoneskin (3 charges), Wall of Stone (3 charges)

    Burning Hands (1 charge), Fireball (2 charges), Fire Storm (4 charges), Wall of Fire (3 charges)

    Create or Destroy Water (1 charge), Ice Storm (2 charges), Tsunami (5 charges), Wall of Ice (3 charges), Water Walk (2 charges)
