      upTo: 9
      deflect: true
      schools:
        - enchantment
      deflectOnly: true
      resource: staff-of-charming
    - kind: saveRescue
      from:
        schools:
          - enchantment
      bonus:
        base: 30
      resource: staff-of-charming-resist
  resources:
