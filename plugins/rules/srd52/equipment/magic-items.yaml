- id: srd52:item/sun-blade
  name: Sun Blade
  type: magicItem
  category: weapon
  rarity: rare
  attunement: true
  automation: partial
  damageType: radiant
  addProperties:
    - finesse
  hitDamage:
    - amount:
        dice: 1d8
      type: radiant
      only:
        - undead
  bonuses:
    - to: attack
      amount: 2
    - to: damage
      amount: 2
  text: |-
    This item appears to be a sword hilt. Blade of Radiance. While grasping the hilt, you can take a Bonus Action to cause a blade of pure radiance to spring into existence or make the blade disappear. While the blade exists, this magic weapon functions as a Longsword with the Finesse property. If you are proficient with Longswords or Shortswords, you are proficient with the Sun Blade. You gain a +2 bonus to attack rolls and damage rolls made with this weapon, which deals Radiant damage instead of Slashing damage. When you hit an Undead with it, that target takes an extra 1d8 Radiant damage. Sunlight. The sword’s luminous blade emits Bright Light in a 15-foot radius and Dim Light for an additional 15 feet. The light is sunlight. While the blade persists, you can take a Magic action to expand or reduce its radius of Bright Light and Dim Light by 5 feet each, to a maximum of 30 feet each or a minimum of 10 feet each.

    Weapon (Glaive, Greatsword, Longsword, Rapier, Scimitar, or Shortsword), Rare (Requires Attunement) When you attack a creature with this magic weapon and roll a 20 on the d20 for the attack roll, that target takes an extra 15 Necrotic damage if it isn’t a Construct or an Undead, and you gain Temporary Hit Points equal to the amount of Necrotic damage taken.

    Weapon (Glaive, Greatsword, Longsword, or Scimitar), Very Rare (Requires Attunement) When you attack an object with this magic weapon and hit, maximize your weapon damage dice against the target. When you attack a creature with this weapon and roll a 20 on the d20 for the attack roll, that target takes an extra 14 Slashing damage and gains 1 Exhaustion level.

    Weapon (Glaive, Greatsword, Longsword, Rapier, Scimitar, or Shortsword), Rare (Requires Attunement) When you hit a creature with an attack using this magic weapon, the target takes an extra 2d6 Necrotic damage and must succeed on a DC 15 Constitution saving throw or be unable to regain Hit Points for 1 hour. The target repeats the save at the end of each of its turns, ending the effect on itself on a success.
- id: srd52:item/talisman-of-pure-good
  name: Talisman of Pure Good
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: true
  attunementBy: a Cleric or Paladin
  automation: full
  attuneBy:
    classes:
      - cleric
      - paladin
  resources:
