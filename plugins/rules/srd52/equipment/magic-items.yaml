      max:
        base: 10
      recharge:
        - on: dawn
          amount: 2
          roll: 1d8
    - id: staff-of-charming-resist
      max:
        base: 1
      recharge:
        - on: dawn
          amount: all
  casts:
    - spell: charm-person
    - spell: command
    - spell: comprehend-languages
