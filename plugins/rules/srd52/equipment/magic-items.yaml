- id: srd52:item/weapon-of-warning
  name: Weapon of Warning
  type: magicItem
  category: weapon
  rarity: uncommon
  attunement: true
  automation: full
  passives:
    - kind: initiativeAdvantage
      allies: true
  text: As long as this weapon is within your reach and you are attuned to it, you and allies within 30 feet of you gain the following benefits. Alarm. The weapon magically awakens each subject who is sleeping naturally when combat begins. This benefit doesn’t wake a subject from magically induced sleep. Supernatural Readiness. Each subject has Advantage on its Initiative rolls.
- id: srd52:item/well-of-many-worlds
  name: Well of Many Worlds
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: false
  automation: full
  resources:
    - id: well-of-many-worlds
      max:
        base: 1
      recharge:
        - on: longRest
          amount: all
  activations:
    - name: Well of Many Worlds
      activation:
        cost:
          - action
          - resource: well-of-many-worlds
        targeting:
          self: true
        resolution:
          kind: automatic
          effects:
            - kind: escape
  text: This fine black cloth, soft as silk, is folded up to the dimensions of a handkerchief. It unfolds into a circular sheet 6 feet in diameter. You can take a Magic action to unfold the Well of Many Worlds and place it on a solid surface, whereupon it forms a two-way, 6-foot-diameter, circular portal to another world or plane of existence. Each time the item opens a portal, the GM decides where it leads. The portal remains open until a creature within 5 feet of it takes a Magic action to close it by taking hold of the edges of the cloth and folding it up. Once the Well of Many Worlds has opened a portal, it can’t do so again for 1d8 hours.
