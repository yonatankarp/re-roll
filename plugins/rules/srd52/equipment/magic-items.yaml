                dice: 1d4
              type: bludgeoning
          onSuccessDamage: none
          onFail:
            - kind: applyCondition
              condition: prone
              duration: instantaneous
          onSuccess: []
  text: "This stoppered flask sloshes when shaken, as if it contains water. The decanter weighs 2 pounds. You can take a Magic action to remove the stopper and issue one of three command words, whereupon an amount of fresh water or salt water (your choice) pours out of the flask. The water stops pouring out at the start of your next turn. Choose from the following command words: Splash. The decanter produces 1 gallon of water. Fountain. The decanter produces 5 gallons of water. Geyser. The decanter produces 30 gallons of water that gushes forth in a Line 30 feet long and 1 foot wide. If you’re holding the decanter, you can aim the geyser in one direction (no action required). One creature of your choice in the Line must succeed on a DC 13 Strength saving throw or take 1d4 Bludgeoning damage and have the Prone condition. Instead of a creature, you can target one object in the Line that isn’t being worn or carried and that weighs no more than 200 pounds. The object is knocked over by the geyser."
- id: srd52:item/deck-of-illusions
  name: Deck of Illusions
  type: magicItem
  category: wondrousItem
  rarity: uncommon
  attunement: false
  automation: full
  activations:
    - name: Draw a Card
      activation:
        cost:
          - action
        targeting:
          area:
            shape: cube
            radius: 5
          range: 30
          side: enemy
        area:
          moves: 30
        resolution:
          kind: automatic
          effects:
            - kind: zone
              zone: image
              radius: 0
              dc: 15
              duration:
                minutes: 1440
  text: |-
    This box contains a set of cards. A full deck has 34 cards: 32 depicting specific creatures and two with a mirrored surface. A deck found as treasure is usually missing 1d20 − 1 cards. The magic of the deck functions only if its cards are drawn at random. You can take a Magic action to draw a card at random from the deck and throw it to the ground at a point within 30 feet of yourself. An illusion of a creature, determined by rolling on the Deck of Illusions table, forms over the thrown card and remains until dispelled. The illusory creature created by the card looks and behaves like a real creature of its kind, except that it can do no harm. While you are within 120 feet of the illusory creature and can see it, you can take a Magic action to move it anywhere within 30 feet of its card. Any physical interaction with the illusory creature reveals it to be false, because objects pass through it. A creature that takes a Study action to visually inspect the illusory creature identifies it as an illusion with a successful DC 15 Intelligence (Investigation) check. The illusion lasts until its card is moved or the illusion is dispelled (using a Dispel

    Magic spell or a similar effect). When the illusion ends, the image on its card disappears, and that card can’t be used again.

    *Stat blocks for these creatures (except the card drawer) appear in “Monsters.”
