      max:
        base: 7
      recharge: []
  lastCharge: vanishes
  activations:
    - name: Pure Rebuke
      activation:
        cost:
          - action
          - resource: talisman-of-pure-good
        targeting:
          creatures: 1
          range: 120
          side: enemy
        resolution:
          kind: save
          ability: dex
          dc:
            base: 20
          edges:
            - creatureTypes:
                - fiend
                - undead
              roll: disadvantage
          damage:
            - amount:
                dice: 4d6
              type: psychic
          onSuccessDamage: full
          onFail:
            - kind: slay
              hpAtMost: 100000
  bonuses:
    - to: spellAttack
      amount: 2
  text: |-
    Cleric or Paladin) This talisman is a mighty symbol of goodness. A Fiend or an Undead that touches the talisman takes 8d6 Radiant damage and takes the damage again each time it ends its turn holding or carrying the talisman.

    Holy Symbol. You can use the talisman as a Holy Symbol. You gain a +2 bonus to spell attack rolls while you wear or hold it. Pure Rebuke. The talisman has 7 charges. While wearing or holding the talisman, you can take a Magic action to expend 1 charge and target one creature you can see on the ground within 120 feet of yourself. A flaming fissure opens under the target, and the target makes a DC 20 Dexterity saving throw. If the target is a Fiend or an Undead, it has Disadvantage on the save. On a failed save, the target falls into the fissure and is destroyed, leaving no remains. On a successful save, the target isn’t cast into the fissure but takes 4d6 Psychic damage from the ordeal. In either case, the fissure then closes, leaving no trace of its existence. When you expend the last charge, the talisman disperses into motes of golden light and is destroyed.
- id: srd52:item/talisman-of-the-sphere
  name: Talisman of the Sphere
  type: magicItem
  category: wondrousItem
  rarity: legendary
  attunement: true
  automation: full
  text: While holding or wearing this talisman, you have Advantage on any Intelligence (Arcana) check you make to control a Sphere of Annihilation. In addition, when you start your turn in control of a Sphere of Annihilation, you can take a Magic action to move it 10 feet plus a number of additional feet equal to 10 times your Intelligence modifier. This movement doesn’t have to be in a straight line.
